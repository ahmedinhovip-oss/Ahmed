/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

#app{position:absolute!important;inset:auto!important;color:#1d1f22;font-family:Inter,system-ui,sans-serif}
button,select,input{font-family:inherit}

\u062A\u0648\u062C\u062F \u0625\u0646\u0630\u0627\u0631\u0627\u062A \u0646\u0634\u0637\u0629","No violations so far.":"\u0644\u0627 \u062A\u0648\u062C\u062F \u0645\u062E\u0627\u0644\u0641\u0627\u062A \u062D\u062A\u0649 \u0627\u0644\u0622\u0646.","Three posts (2) into the snouted base (1)":"\u062B\u0644\u0627\u062B\u0629 \u0623\u0639\u0645\u062F\u0629 (2) \u0641\u064A \u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0630\u0627\u062A \u0627\u0644\u0641\u0648\u0647\u0629 (1)","Shaft assembly (3) down through the base":"\u0645\u062C\u0645\u0648\u0639\u0629 \u0627\u0644\u0639\u0645\u0648\u062F (3) \u0646\u0632\u0648\u0644\u064B\u0627 \u0639\u0628\u0631 \u0627\u0644\u0642\u0627\u0639\u062F\u0629","Hook rotor (4) onto the shaft, inside the base":"\u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0627\u0644\u062E\u0637\u0627\u0641\u064A (4) \u0639\u0644\u0649 \u0627\u0644\u0639\u0645\u0648\u062F \u062F\u0627\u062E\u0644 \u0627\u0644\u0642\u0627\u0639\u062F\u0629","Motor mount (5) on the posts":"\u0642\u0627\u0639\u062F\u0629 \u0627\u0644\u0645\u062D\u0631\u0643 (5) \u0639\u0644\u0649 \u0627\u0644\u0623\u0639\u0645\u062F\u0629","Solid coupling (9) on the shaft, 162 mm offset distance":"\u0627\u0644\u0648\u0635\u0644\u0629 \u0627\u0644\u0635\u0644\u0628\u0629 (9) \u0639\u0644\u0649 \u0627\u0644\u0639\u0645\u0648\u062F\u060C \u0645\u0633\u0627\u0641\u0629 \u0627\u0644\u0625\u0632\u0627\u062D\u0629 162 mm","Star ring (8) on the motor mount":"\u0627\u0644\u062D\u0644\u0642\u0629 \u0627\u0644\u0646\u062C\u0645\u064A\u0629 (8) \u0639\u0644\u0649 \u0642\u0627\u0639\u062F\u0629 \u0627\u0644\u0645\u062D\u0631\u0643","Motor (6) into the coupling, on the star ring":"\u0627\u0644\u0645\u062D\u0631\u0643 (6) \u0641\u064A \u0627\u0644\u0648\u0635\u0644\u0629 \u0648\u0639\u0644\u0649 \u0627\u0644\u062D\u0644\u0642\u0629 \u0627\u0644\u0646\u062C\u0645\u064A\u0629","Bail (7) strapped to the motor for lifting":"\u0645\u0642\u0628\u0636 \u0627\u0644\u0631\u0641\u0639 (7) \u0645\u062B\u0628\u062A \u0639\u0644\u0649 \u0627\u0644\u0645\u062D\u0631\u0643",'4 \xD7 1/2"-13 \xD7 1 3/4" hex bolts (13) + 1/2" lock washers (10)':'4 \xD7 \u0645\u0633\u0627\u0645\u064A\u0631 \u0633\u062F\u0627\u0633\u064A\u0629 1/2"-13 \xD7 1 3/4" (13) + \u062D\u0644\u0642\u0627\u062A \u0642\u0641\u0644 1/2" (10)','4 \xD7 1/2"-13 \xD7 1 1/2" hex bolts (12) + 1/2" lock washers (10)':'4 \xD7 \u0645\u0633\u0627\u0645\u064A\u0631 \u0633\u062F\u0627\u0633\u064A\u0629 1/2"-13 \xD7 1 1/2" (12) + \u062D\u0644\u0642\u0627\u062A \u0642\u0641\u0644 1/2" (10)','4 \xD7 3/8"-16 \xD7 1 3/4" hex bolts (14) + 3/8" lock washers (11)':'4 \xD7 \u0645\u0633\u0627\u0645\u064A\u0631 \u0633\u062F\u0627\u0633\u064A\u0629 3/8"-16 \xD7 1 3/4" (14) + \u062D\u0644\u0642\u0627\u062A \u0642\u0641\u0644 3/8" (11)',"Pump assembled and checked on the maintenance stand":"\u0627\u0644\u0645\u0636\u062E\u0629 \u0645\u062C\u0645\u0651\u0639\u0629 \u0648\u0645\u0641\u062D\u0648\u0635\u0629 \u0639\u0644\u0649 \u062D\u0627\u0645\u0644 \u0627\u0644\u0635\u064A\u0627\u0646\u0629","Preheated over the bath to 500 \xB0C before it touches the metal":"\u062A\u0633\u062E\u064A\u0646 \u0645\u0633\u0628\u0642 \u0641\u0648\u0642 \u0627\u0644\u0645\u0635\u0647\u0648\u0631 \u0625\u0644\u0649 500 \xB0C \u0642\u0628\u0644 \u0645\u0644\u0627\u0645\u0633\u0629 \u0627\u0644\u0645\u0639\u062F\u0646","Lowered into the well, base on the floor, no thermal shock":"\u0625\u0646\u0632\u0627\u0644\u0647\u0627 \u0641\u064A \u0627\u0644\u0628\u0626\u0631 \u0648\u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0639\u0644\u0649 \u0627\u0644\u0623\u0631\u0636\u064A\u0629 \u062F\u0648\u0646 \u0635\u062F\u0645\u0629 \u062D\u0631\u0627\u0631\u064A\u0629","Started at low speed (\u2264 25 Hz), then ramped up":"\u0627\u0644\u062A\u0634\u063A\u064A\u0644 \u0628\u0633\u0631\u0639\u0629 \u0645\u0646\u062E\u0641\u0636\u0629 (\u2264 25 Hz) \u062B\u0645 \u0627\u0644\u0632\u064A\u0627\u062F\u0629 \u062A\u062F\u0631\u064A\u062C\u064A\u064B\u0627","Metal flowing into the launder":"\u0627\u0644\u0645\u0639\u062F\u0646 \u064A\u062A\u062F\u0641\u0642 \u0625\u0644\u0649 \u0627\u0644\u0645\u062C\u0631\u0649","Transfer stopped before the level falls below the pump minimum":"\u0625\u064A\u0642\u0627\u0641 \u0627\u0644\u0646\u0642\u0644 \u0642\u0628\u0644 \u0646\u0632\u0648\u0644 \u0627\u0644\u0645\u0633\u062A\u0648\u0649 \u062A\u062D\u062A \u062D\u062F \u0627\u0644\u0645\u0636\u062E\u0629 \u0627\u0644\u0623\u062F\u0646\u0649","Lifted out: base and rotor cleaned of dross, parts inspected":"\u0631\u0641\u0639\u0647\u0627 \u0644\u0644\u062E\u0627\u0631\u062C: \u062A\u0646\u0638\u064A\u0641 \u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0648\u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0645\u0646 \u0627\u0644\u062E\u0628\u062B \u0648\u0641\u062D\u0635 \u0627\u0644\u0642\u0637\u0639","MOTOR OVERLOAD TRIP":"\u0641\u0635\u0644 \u0627\u0644\u0645\u062D\u0631\u0643 \u0628\u0633\u0628\u0628 \u0627\u0644\u062D\u0645\u0644 \u0627\u0644\u0632\u0627\u0626\u062F","METAL LEVEL BELOW PUMP MINIMUM \xB7 AIR DRAWN IN":"\u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0645\u0639\u062F\u0646 \u062A\u062D\u062A \u062D\u062F \u0627\u0644\u0645\u0636\u062E\u0629 \xB7 \u0633\u062D\u0628 \u0647\u0648\u0627\u0621","PUMP NOT PREHEATED":"\u0627\u0644\u0645\u0636\u062E\u0629 \u063A\u064A\u0631 \u0645\u0633\u062E\u0651\u0646\u0629 \u0645\u0633\u0628\u0642\u064B\u0627","ROTOR JAMMED":"\u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0639\u0627\u0644\u0642","COUPLING VIBRATION":"\u0627\u0647\u062A\u0632\u0627\u0632 \u0627\u0644\u0648\u0635\u0644\u0629","EMERGENCY STOP PRESSED":"\u062A\u0645 \u0627\u0644\u0636\u063A\u0637 \u0639\u0644\u0649 \u0625\u064A\u0642\u0627\u0641 \u0627\u0644\u0637\u0648\u0627\u0631\u0626","PUMP CRACKED \xB7 THERMAL SHOCK":"\u0627\u0644\u0645\u0636\u062E\u0629 \u0645\u062A\u0634\u0642\u0642\u0629 \xB7 \u0635\u062F\u0645\u0629 \u062D\u0631\u0627\u0631\u064A\u0629","FLOW LOW \xB7 DROSS IN THE BASE":"\u062A\u062F\u0641\u0642 \u0645\u0646\u062E\u0641\u0636 \xB7 \u062E\u0628\u062B \u0641\u064A \u0627\u0644\u0642\u0627\u0639\u062F\u0629","No fault":"\u0644\u0627 \u064A\u0648\u062C\u062F \u0639\u0637\u0644","Dross building up in the base":"\u062A\u0631\u0627\u0643\u0645 \u0627\u0644\u062E\u0628\u062B \u0641\u064A \u0627\u0644\u0642\u0627\u0639\u062F\u0629","Solid piece jams the rotor":"\u0642\u0637\u0639\u0629 \u0635\u0644\u0628\u0629 \u062A\u0639\u0644\u0642 \u0627\u0644\u062F\u0648\u0651\u0627\u0631","Coupling loose / misaligned":"\u0627\u0644\u0648\u0635\u0644\u0629 \u0645\u0631\u062A\u062E\u064A\u0629 / \u063A\u064A\u0631 \u0645\u062D\u0627\u0630\u064A\u0629","Furnace nearly empty":"\u0627\u0644\u0641\u0631\u0646 \u0634\u0628\u0647 \u0641\u0627\u0631\u063A","Bring the pump to the maintenance stand first":"\u0623\u062D\u0636\u0631 \u0627\u0644\u0645\u0636\u062E\u0629 \u0625\u0644\u0649 \u062D\u0627\u0645\u0644 \u0627\u0644\u0635\u064A\u0627\u0646\u0629 \u0623\u0648\u0644\u064B\u0627","Lift the pump out onto the stand to clean it":"\u0627\u0631\u0641\u0639 \u0627\u0644\u0645\u0636\u062E\u0629 \u0625\u0644\u0649 \u0627\u0644\u062D\u0627\u0645\u0644 \u0644\u062A\u0646\u0638\u064A\u0641\u0647\u0627","Base and rotor cleaned of dross; rotor and shaft inspected":"\u062A\u0645 \u062A\u0646\u0638\u064A\u0641 \u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0648\u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0645\u0646 \u0627\u0644\u062E\u0628\u062B\u061B \u0648\u0641\u062D\u0635 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0648\u0627\u0644\u0639\u0645\u0648\u062F","Stop the pump before moving it":"\u0623\u0648\u0642\u0641 \u0627\u0644\u0645\u0636\u062E\u0629 \u0642\u0628\u0644 \u062A\u062D\u0631\u064A\u0643\u0647\u0627","Assemble the pump completely before lifting it to the furnace":"\u062C\u0645\u0651\u0639 \u0627\u0644\u0645\u0636\u062E\u0629 \u0628\u0627\u0644\u0643\u0627\u0645\u0644 \u0642\u0628\u0644 \u0631\u0641\u0639\u0647\u0627 \u0625\u0644\u0649 \u0627\u0644\u0641\u0631\u0646","Pump immersed without preheating: thermal shock cracks the rotor and the posts":"\u063A\u0645\u0631 \u0627\u0644\u0645\u0636\u062E\u0629 \u062F\u0648\u0646 \u062A\u0633\u062E\u064A\u0646 \u0645\u0633\u0628\u0642: \u0627\u0644\u0635\u062F\u0645\u0629 \u0627\u0644\u062D\u0631\u0627\u0631\u064A\u0629 \u062A\u0634\u0642\u0642 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0648\u0627\u0644\u0623\u0639\u0645\u062F\u0629","Release the emergency stop first":"\u062D\u0631\u0651\u0631 \u0625\u064A\u0642\u0627\u0641 \u0627\u0644\u0637\u0648\u0627\u0631\u0626 \u0623\u0648\u0644\u064B\u0627","Overload tripped: find the cause and reset":"\u0641\u0635\u0644 \u0627\u0644\u062D\u0645\u0644 \u0627\u0644\u0632\u0627\u0626\u062F: \u0627\u0639\u062B\u0631 \u0639\u0644\u0649 \u0627\u0644\u0633\u0628\u0628 \u062B\u0645 \u0623\u0639\u062F \u0627\u0644\u0636\u0628\u0637","The pump is not assembled":"\u0627\u0644\u0645\u0636\u062E\u0629 \u063A\u064A\u0631 \u0645\u062C\u0645\u0651\u0639\u0629","Pump started out of the metal: the rotor runs dry":"\u062A\u0634\u063A\u064A\u0644 \u0627\u0644\u0645\u0636\u062E\u0629 \u062E\u0627\u0631\u062C \u0627\u0644\u0645\u0639\u062F\u0646: \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u064A\u0639\u0645\u0644 \u062C\u0627\u0641\u064B\u0627","Started at high speed: ramp up from low speed [A]":"\u0627\u0644\u062A\u0634\u063A\u064A\u0644 \u0628\u0633\u0631\u0639\u0629 \u0639\u0627\u0644\u064A\u0629: \u0627\u0628\u062F\u0623 \u0628\u0633\u0631\u0639\u0629 \u0645\u0646\u062E\u0641\u0636\u0629 \u062B\u0645 \u0632\u062F \u062A\u062F\u0631\u064A\u062C\u064A\u064B\u0627","Still jammed: lift the pump out and clear the base":"\u0644\u0627 \u064A\u0632\u0627\u0644 \u0639\u0627\u0644\u0642\u064B\u0627: \u0627\u0631\u0641\u0639 \u0627\u0644\u0645\u0636\u062E\u0629 \u0648\u0646\u0638\u0651\u0641 \u0627\u0644\u0642\u0627\u0639\u062F\u0629","Rotor jammed: the motor tripped on overload. Never force it: the shaft breaks":"\u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0639\u0627\u0644\u0642: \u0641\u0635\u0644 \u0627\u0644\u0645\u062D\u0631\u0643 \u0628\u0627\u0644\u062D\u0645\u0644 \u0627\u0644\u0632\u0627\u0626\u062F. \u0644\u0627 \u062A\u062C\u0628\u0631\u0647 \u0623\u0628\u062F\u064B\u0627: \u0627\u0644\u0639\u0645\u0648\u062F \u064A\u0646\u0643\u0633\u0631","Vibration at the motor: check the coupling and the 162 mm offset distance":"\u0627\u0647\u062A\u0632\u0627\u0632 \u0639\u0646\u062F \u0627\u0644\u0645\u062D\u0631\u0643: \u0627\u0641\u062D\u0635 \u0627\u0644\u0648\u0635\u0644\u0629 \u0648\u0645\u0633\u0627\u0641\u0629 \u0627\u0644\u0625\u0632\u0627\u062D\u0629 162 mm","Metal level below the pump minimum: air is drawn in, oxides go to the launder":"\u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0645\u0639\u062F\u0646 \u062A\u062D\u062A \u062D\u062F \u0627\u0644\u0645\u0636\u062E\u0629: \u064A\u064F\u0633\u062D\u0628 \u0627\u0644\u0647\u0648\u0627\u0621 \u0648\u062A\u0630\u0647\u0628 \u0627\u0644\u0623\u0643\u0627\u0633\u064A\u062F \u0625\u0644\u0649 \u0627\u0644\u0645\u062C\u0631\u0649","Rotor running dry out of the metal":"\u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u064A\u0639\u0645\u0644 \u062C\u0627\u0641\u064B\u0627 \u062E\u0627\u0631\u062C \u0627\u0644\u0645\u0639\u062F\u0646","MMEI MINI-902L \xB7 assembly and operation":"MMEI MINI-902L \xB7 \u0627\u0644\u062A\u062C\u0645\u064A\u0639 \u0648\u0627\u0644\u062A\u0634\u063A\u064A\u0644",OVERVIEW:"\u0646\u0638\u0631\u0629 \u0639\u0627\u0645\u0629","PUMP ASSEMBLY":"\u0645\u062C\u0645\u0648\u0639\u0629 \u0627\u0644\u0645\u0636\u062E\u0629","MOTOR & COUPLING":"\u0627\u0644\u0645\u062D\u0631\u0643 \u0648\u0627\u0644\u0648\u0635\u0644\u0629","BASE & ROTOR":"\u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0648\u0627\u0644\u062F\u0648\u0651\u0627\u0631","WELL & LAUNDER":"\u0627\u0644\u0628\u0626\u0631 \u0648\u0627\u0644\u0645\u062C\u0631\u0649","PARTS TABLE":"\u0637\u0627\u0648\u0644\u0629 \u0627\u0644\u0642\u0637\u0639",CUTAWAY:"\u0645\u0642\u0637\u0639",LABELS:"\u0627\u0644\u062A\u0633\u0645\u064A\u0627\u062A",SCENARIO:"\u0627\u0644\u0633\u064A\u0646\u0627\u0631\u064A\u0648","PARTS ON THE TABLE":"\u0627\u0644\u0642\u0637\u0639 \u0639\u0644\u0649 \u0627\u0644\u0637\u0627\u0648\u0644\u0629","RUNNING IN THE WELL":"\u062A\u0639\u0645\u0644 \u0641\u064A \u0627\u0644\u0628\u0626\u0631","SIM SPEED":"\u0633\u0631\u0639\u0629 \u0627\u0644\u0645\u062D\u0627\u0643\u0627\u0629","INJECT FAULT":"\u0625\u062F\u062E\u0627\u0644 \u0639\u0637\u0644","GUIDED TOUR \xB7 CLICK TO TAKE OVER":"\u062C\u0648\u0644\u0629 \u0625\u0631\u0634\u0627\u062F\u064A\u0629 \xB7 \u0627\u0646\u0642\u0631 \u0644\u062A\u062A\u0648\u0644\u0649 \u0627\u0644\u062A\u062D\u0643\u0645","\u25B6 RESTART GUIDED TOUR":"\u25B6 \u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u062C\u0648\u0644\u0629 \u0627\u0644\u0625\u0631\u0634\u0627\u062F\u064A\u0629","You have control. Assemble, preheat, immerse and run the pump from the right; drag to orbit, scroll to zoom.":"\u0623\u0635\u0628\u062D \u0627\u0644\u062A\u062D\u0643\u0645 \u0628\u064A\u062F\u0643. \u062C\u0645\u0651\u0639 \u0627\u0644\u0645\u0636\u062E\u0629 \u0648\u0633\u062E\u0651\u0646\u0647\u0627 \u0648\u0627\u063A\u0645\u0631\u0647\u0627 \u0648\u0634\u063A\u0651\u0644\u0647\u0627 \u0645\u0646 \u0627\u0644\u064A\u0645\u064A\u0646\u061B \u0627\u0633\u062D\u0628 \u0644\u0644\u062A\u062F\u0648\u064A\u0631 \u0648\u0645\u0631\u0651\u0631 \u0644\u0644\u062A\u0643\u0628\u064A\u0631.",MOTOR:"\u0627\u0644\u0645\u062D\u0631\u0643","MOTOR MOUNT \xB7 COUPLING":"\u0642\u0627\u0639\u062F\u0629 \u0627\u0644\u0645\u062D\u0631\u0643 \xB7 \u0627\u0644\u0648\u0635\u0644\u0629",POSTS:"\u0627\u0644\u0623\u0639\u0645\u062F\u0629","SNOUTED BASE":"\u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0630\u0627\u062A \u0627\u0644\u0641\u0648\u0647\u0629","HOOK ROTOR":"\u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0627\u0644\u062E\u0637\u0627\u0641\u064A",BAIL:"\u0645\u0642\u0628\u0636 \u0627\u0644\u0631\u0641\u0639",BATH:"\u0627\u0644\u0645\u0635\u0647\u0648\u0631","above the base":"\u0641\u0648\u0642 \u0627\u0644\u0642\u0627\u0639\u062F\u0629",LAUNDER:"\u0627\u0644\u0645\u062C\u0631\u0649",loose:"\u063A\u064A\u0631 \u0645\u0631\u0643\u0651\u0628\u0629","MINI launder transfer pump (MMEI MINI-902L-22ABL0): a 4 HP motor turns a 7 in rotor in a snouted base on the well floor, pushing metal up the riser into the launder.":"\u0645\u0636\u062E\u0629 \u0646\u0642\u0644 MINI (MMEI MINI-902L-22ABL0): \u0645\u062D\u0631\u0643 4 HP \u064A\u062F\u064A\u0631 \u062F\u0648\u0651\u0627\u0631\u064B\u0627 7 in \u0641\u064A \u0642\u0627\u0639\u062F\u0629 \u0630\u0627\u062A \u0641\u0648\u0647\u0629 \u0639\u0644\u0649 \u0623\u0631\u0636\u064A\u0629 \u0627\u0644\u0628\u0626\u0631\u060C \u0641\u064A\u062F\u0641\u0639 \u0627\u0644\u0645\u0639\u062F\u0646 \u0639\u0628\u0631 \u0627\u0644\u0623\u0646\u0628\u0648\u0628 \u0627\u0644\u0635\u0627\u0639\u062F \u0625\u0644\u0649 \u0627\u0644\u0645\u062C\u0631\u0649.","On the maintenance stand: the snouted base, and the parts of the bill of materials on the table.":"\u0639\u0644\u0649 \u062D\u0627\u0645\u0644 \u0627\u0644\u0635\u064A\u0627\u0646\u0629: \u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0630\u0627\u062A \u0627\u0644\u0641\u0648\u0647\u0629\u060C \u0648\u0642\u0637\u0639 \u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u0645\u0648\u0627\u062F \u0639\u0644\u0649 \u0627\u0644\u0637\u0627\u0648\u0644\u0629.","Out of order is refused: the motor needs the posts, shaft, mount, coupling and star ring first.":"\u0627\u0644\u062A\u0631\u062A\u064A\u0628 \u0627\u0644\u062E\u0627\u0637\u0626 \u0645\u0631\u0641\u0648\u0636: \u0627\u0644\u0645\u062D\u0631\u0643 \u064A\u062D\u062A\u0627\u062C \u0623\u0648\u0644\u064B\u0627 \u0627\u0644\u0623\u0639\u0645\u062F\u0629 \u0648\u0627\u0644\u0639\u0645\u0648\u062F \u0648\u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0648\u0627\u0644\u0648\u0635\u0644\u0629 \u0648\u0627\u0644\u062D\u0644\u0642\u0629 \u0627\u0644\u0646\u062C\u0645\u064A\u0629.","Three posts (2) into the base (1)\u2026":"\u062B\u0644\u0627\u062B\u0629 \u0623\u0639\u0645\u062F\u0629 (2) \u0641\u064A \u
