/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

#app{position:absolute!important;inset:auto!important;color:#1d1f22;font-family:Inter,system-ui,sans-serif}
button,select,input{font-family:inherit}

\u0643 \u0627\u0644\u062D\u0627\u062C\u0632","Cycle stopped by operator":"\u0623\u0648\u0642\u0641 \u0627\u0644\u0645\u0634\u063A\u0651\u0644 \u0627\u0644\u062F\u0648\u0631\u0629","Gas pressure low: rotor returns home":"\u0636\u063A\u0637 \u0627\u0644\u063A\u0627\u0632 \u0645\u0646\u062E\u0641\u0636: \u064A\u0639\u0648\u062F \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0625\u0644\u0649 \u0645\u0648\u0636\u0639 \u0627\u0644\u0628\u062F\u0627\u064A\u0629","Hydraulic motor tripped":"\u0641\u0635\u0644 \u0642\u0627\u0637\u0639 \u0645\u062D\u0631\u0643 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u0644\u064A\u0643","Rotor motor tripped":"\u0641\u0635\u0644 \u0642\u0627\u0637\u0639 \u0645\u062D\u0631\u0643 \u0627\u0644\u062F\u0648\u0651\u0627\u0631","Rotor reached the bottom without the middle sensor":"\u0648\u0635\u0644 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0625\u0644\u0649 \u0627\u0644\u0623\u0633\u0641\u0644 \u062F\u0648\u0646 \u0625\u0634\u0627\u0631\u0629 \u0627\u0644\u062D\u0633\u0627\u0633 \u0627\u0644\u0623\u0648\u0633\u0637","Vane feeder tripped":"\u0641\u0635\u0644 \u0642\u0627\u0637\u0639 \u0627\u0644\u0645\u063A\u0630\u064A \u0627\u0644\u0631\u064A\u0634\u064A","Lamp test":"\u0627\u062E\u062A\u0628\u0627\u0631 \u0627\u0644\u0645\u0635\u0627\u0628\u064A\u062D","Buzzer test":"\u0627\u062E\u062A\u0628\u0627\u0631 \u0627\u0644\u062C\u0631\u0633","Rotary degassing machine (Nutec-Thermo, machines 136\u2013141). A 1 t ladle at 745 \xB0C sits under the rotor; hydrogen is 0.28 ml/100 g.":"\u0645\u0627\u0643\u064A\u0646\u0629 \u0646\u0632\u0639 \u0627\u0644\u063A\u0627\u0632 \u0628\u0627\u0644\u062F\u0648\u0651\u0627\u0631 (Nutec-Thermo\u060C \u0627\u0644\u0645\u0627\u0643\u064A\u0646\u0627\u062A 136\u2013141). \u0645\u063A\u0631\u0641\u0629 1 \u0637\u0646 \u0639\u0646\u062F 745 \xB0C \u062A\u062D\u062A \u0627\u0644\u062F\u0648\u0651\u0627\u0631\u060C \u0648\u0627\u0644\u0647\u064A\u062F\u0631\u0648\u062C\u064A\u0646 0.28 ml/100 g.","Rotary degassing machine (Nutec-Thermo). A 1 t ladle at 745 \xB0C, hydrogen 0.28 ml/100 g.":"\u0645\u0627\u0643\u064A\u0646\u0629 \u0646\u0632\u0639 \u0627\u0644\u063A\u0627\u0632 \u0628\u0627\u0644\u062F\u0648\u0651\u0627\u0631 (Nutec-Thermo). \u0645\u063A\u0631\u0641\u0629 1 \u0637\u0646 \u0639\u0646\u062F 745 \xB0C\u060C \u0648\u0627\u0644\u0647\u064A\u062F\u0631\u0648\u062C\u064A\u0646 0.28 ml/100 g.","Mode screen: AUTO for regular production (tower lamp green), MANUAL for setting up (tower lamp yellow).":"\u0634\u0627\u0634\u0629 \u0627\u0644\u0648\u0636\u0639: \u0627\u0644\u0622\u0644\u064A \u0644\u0644\u0625\u0646\u062A\u0627\u062C \u0627\u0644\u0645\u0639\u062A\u0627\u062F (\u0628\u0631\u062C \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0623\u062E\u0636\u0631)\u060C \u0648\u0627\u0644\u064A\u062F\u0648\u064A \u0644\u0644\u0636\u0628\u0637 (\u0628\u0631\u062C \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0623\u0635\u0641\u0631).","Settings (password 12345): down and up delays, vortex, fluxing, mixing and degassing times, gas pressure and flow, and the three rotor speeds.":"\u0627\u0644\u0625\u0639\u062F\u0627\u062F\u0627\u062A (\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 12345): \u062A\u0623\u062E\u064A\u0631\u0627 \u0627\u0644\u0625\u0646\u0632\u0627\u0644 \u0648\u0627\u0644\u0631\u0641\u0639\u060C \u0648\u0623\u0632\u0645\u0646\u0629 \u0627\u0644\u062F\u0648\u0627\u0645\u0629 \u0648\u0627\u0644\u0641\u0644\u0643\u0633 \u0648\u0627\u0644\u062E\u0644\u0637 \u0648\u0646\u0632\u0639 \u0627\u0644\u063A\u0627\u0632\u060C \u0648\u0636\u063A\u0637 \u0627\u0644\u063A\u0627\u0632 \u0648\u062A\u062F\u0641\u0642\u0647\u060C \u0648\u0633\u0631\u0639\u0627\u062A \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0627\u0644\u062B\u0644\u0627\u062B.","Machine Process screen: each step lights as the PLC runs it.":"\u0634\u0627\u0634\u0629 \u0639\u0645\u0644\u064A\u0629 \u0627\u0644\u0645\u0627\u0643\u064A\u0646\u0629: \u062A\u0636\u064A\u0621 \u0643\u0644 \u062E\u0637\u0648\u0629 \u0639\u0646\u062F\u0645\u0627 \u064A\u0646\u0641\u0630\u0647\u0627 \u0627\u0644\u0640 PLC.","CYCLE START: after the 3 s down delay the hydraulic lowers the head from the home (upper) limit.":"\u0628\u062F\u0621 \u0627\u0644\u062F\u0648\u0631\u0629: \u0628\u0639\u062F \u062A\u0623\u062E\u064A\u0631 \u0627\u0644\u0625\u0646\u0632\u0627\u0644 3 \u062B \u064A\u064F\u0646\u0632\u0644 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u0644\u064A\u0643 \u0631\u0623\u0633 \u0627\u0644\u0645\u0627\u0643\u064A\u0646\u0629 \u0645\u0646 \u0645\u0648\u0636\u0639 \u0627\u0644\u0628\u062F\u0627\u064A\u0629 (\u0627\u0644\u062D\u062F \u0627\u0644\u0639\u0644\u0648\u064A).","Middle sensor: the rotor starts at Speed 1 and argon flows at low flow before the rotor enters the metal.":"\u0627\u0644\u062D\u0633\u0627\u0633 \u0627\u0644\u0623\u0648\u0633\u0637: \u064A\u0628\u062F\u0623 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0628\u0627\u0644\u0633\u0631\u0639\u0629 1 \u0648\u064A\u062A\u062F\u0641\u0642 \u0627\u0644\u0623\u0631\u062C\u0648\u0646 \u0628\u062A\u062F\u0641\u0642 \u0645\u0646\u062E\u0641\u0636 \u0642\u0628\u0644 \u062F\u062E\u0648\u0644 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0641\u064A \u0627\u0644\u0645\u0639\u062F\u0646.","Lower limit: the head stops, Speed 2 (600 rpm) opens a vortex and the process timer starts.":"\u0627\u0644\u062D\u062F \u0627\u0644\u0633\u0641\u0644\u064A: \u064A\u062A\u0648\u0642\u0641 \u0627\u0644\u0631\u0623\u0633\u060C \u0648\u062A\u0641\u062A\u062D \u0627\u0644\u0633\u0631\u0639\u0629 2 (600 rpm) \u062F\u0648\u0627\u0645\u0629\u060C \u0648\u064A\u0628\u062F\u0623 \u0645\u0624\u0642\u062A \u0627\u0644\u0639\u0645\u0644\u064A\u0629.","Vane feeder: flux at 180 g/min is drawn down into the vortex, then mixed in.":"\u0627\u0644\u0645\u063A\u0630\u064A \u0627\u0644\u0631\u064A\u0634\u064A: \u064A\u064F\u0633\u062D\u0628 \u0627\u0644\u0641\u0644\u0643\u0633 \u0628\u0645\u0639\u062F\u0644 180 g/min \u0625\u0644\u0649 \u062F\u0627\u062E\u0644 \u0627\u0644\u062F\u0648\u0627\u0645\u0629 \u062B\u0645 \u064A\u064F\u062E\u0644\u0637.","Baffle down, Speed 3 (400 rpm) and high argon flow (40 L/min): the anti-vortex plate stops the vortex and fine bubbles sweep out the hydrogen.":"\u0625\u0646\u0632\u0627\u0644 \u0627\u0644\u062D\u0627\u062C\u0632\u060C \u0648\u0627\u0644\u0633\u0631\u0639\u0629 3 (400 rpm)\u060C \u0648\u062A\u062F\u0641\u0642 \u0623\u0631\u062C\u0648\u0646 \u0645\u0631\u062A\u0641\u0639 (40 L/min): \u064A\u0648\u0642\u0641 \u0644\u0648\u062D \u0645\u0646\u0639 \u0627\u0644\u062F\u0648\u0627\u0645\u0629 \u0627\u0644\u062F\u0648\u0627\u0645\u0629\u060C \u0648\u062A\u0643\u0646\u0633 \u0627\u0644\u0641\u0642\u0627\u0639\u0627\u062A \u0627\u0644\u062F\u0642\u064A\u0642\u0629 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u062C\u064A\u0646.","Admin screen: every motor, limit switch and sensor, with the gas flow, gas pressure and rotor speed.":"\u0634\u0627\u0634\u0629 \u0627\u0644\u0645\u0633\u0624\u0648\u0644: \u0643\u0644 \u0645\u062D\u0631\u0643 \u0648\u0645\u0641\u062A\u0627\u062D \u062D\u062F \u0648\u062D\u0633\u0627\u0633\u060C \u0645\u0639 \u062A\u062F\u0641\u0642 \u0627\u0644\u063A\u0627\u0632 \u0648\u0636\u063A\u0637\u0647 \u0648\u0633\u0631\u0639\u0629 \u0627\u0644\u062F\u0648\u0651\u0627\u0631.","Melt quality: hydrogen falls toward 0.09 ml/100 g and the density index drops below 1 %.":"\u062C\u0648\u062F\u0629 \u0627\u0644\u0645\u0635\u0647\u0648\u0631: \u064A\u0646\u062E\u0641\u0636 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u062C\u064A\u0646 \u0646\u062D\u0648 0.09 ml/100 g\u060C \u0648\u064A\u0647\u0628\u0637 \u0645\u0624\u0634\u0631 \u0627\u0644\u0643\u062B\u0627\u0641\u0629 \u062A\u062D\u062A 1 %.","Degassing done: baffle up, 3 s up delay, then the rotor turns slowly with argon flowing until it leaves the melt and returns home.":"\u0627\u0646\u062A\u0647\u0649 \u0646\u0632\u0639 \u0627\u0644\u063A\u0627\u0632: \u064A\u0631\u062A\u0641\u0639 \u0627\u0644\u062D\u0627\u062C\u0632\u060C \u062B\u0645 \u062A\u0623\u062E\u064A\u0631 \u0631\u0641\u0639 3 \u062B\u060C \u062B\u0645 \u064A\u062F\u0648\u0631 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0628\u0628\u0637\u0621 \u0645\u0639 \u062A\u062F\u0641\u0642 \u0627\u0644\u0623\u0631\u062C\u0648\u0646 \u062D\u062A\u0649 \u064A\u062E\u0631\u062C \u0645\u0646 \u0627\u0644\u0645\u0635\u0647\u0648\u0631 \u0648\u064A\u0639\u0648\u062F \u0625\u0644\u0649 \u0645\u0648\u0636\u0639 \u0627\u0644\u0628\u062F\u0627\u064A\u0629.","Cycle complete. The metal is ready for casting at about 721 \xB0C.":"\u0627\u0643\u062A\u0645\u0644\u062A \u0627\u0644\u062F\u0648\u0631\u0629. \u0627\u0644\u0645\u0639\u062F\u0646 \u062C\u0627\u0647\u0632 \u0644\u0644\u0635\u0628 \u0639\u0646\u062F \u0646\u062D\u0648 721 \xB0C.","A new ladle arrives under the machine.":"\u0648\u0635\u0644\u062A \u0645\u063A\u0631\u0641\u0629 \u062C\u062F\u064A\u062F\u0629 \u062A\u062D\u062A \u0627\u0644\u0645\u0627\u0643\u064A\u0646\u0629.","Next cycle\u2026":"\u0627\u0644\u062F\u0648\u0631\u0629 \u0627\u0644\u062A\u0627\u0644\u064A\u0629\u2026","Fault: the rotor motor MPCB-2 trips. The feeder stops, argon keeps flowing, the head returns home and the tower lamp turns red.":"\u0639\u0637\u0644: \u064A\u0641\u0635\u0644 \u0642\u0627\u0637\u0639 \u0645\u062D\u0631\u0643 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 MPCB-2. \u064A\u062A\u0648\u0642\u0641 \u0627\u0644\u0645\u063A\u0630\u064A\u060C \u0648\u064A\u0633\u062A\u0645\u0631 \u062A\u062F\u0641\u0642 \u0627\u0644\u0623\u0631\u062C\u0648\u0646\u060C \u0648\u064A\u0639\u0648\u062F \u0627\u0644\u0631\u0623\u0633 \u0625\u0644\u0649 \u0645\u0648\u0636\u0639 \u0627\u0644\u0628\u062F\u0627\u064A\u0629\u060C \u0648\u064A\u0636\u064A\u0621 \u0628\u0631\u062C \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0628\u0627\u0644\u0623\u062D\u0645\u0631.","The alarm screen logs MPCB-2_Rotor on_Tripped and Waiting For Reset.":"\u062A\u0633\u062C\u0651\u0644 \u0634\u0627\u0634\u0629 \u0627\u0644\u0625\u0646\u0630\u0627\u0631\u0627\u062A MPCB-2_Rotor on_Tripped \u0648Waiting For Reset.","Fault repaired on site.":"\u062A\u0645 \u0625\u0635\u0644\u0627\u062D \u0627\u0644\u0639\u0637\u0644 \u0641\u064A \u0627\u0644\u0645\u0648\u0642\u0639.","RESET, then Clear the logged alarms.":"\u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u0636\u0628\u0637\u060C \u062B\u0645 \u0645\u0633\u062D \u0627\u0644\u0625\u0646\u0630\u0627\u0631\u0627\u062A \u0627\u0644\u0645\u0633\u062C\u0644\u0629.","Ready for the next ladle.":"\u062C\u0627\u0647\u0632 \u0644\u0644\u0645\u063A\u0631\u0641\u0629 \u0627\u0644\u062A\u0627\u0644\u064A\u0629.","CYCLE START: the head comes down; at the middle sensor the rotor starts and argon flows.":"\u0628\u062F\u0621 \u0627\u0644\u062F\u0648\u0631\u0629: \u064A\u0646\u0632\u0644 \u0627\u0644\u0631\u0623\u0633\u060C \u0648\u0639\u0646\u062F \u0627\u0644\u062D\u0633\u0627\u0633 \u0627\u0644\u0623\u0648\u0633\u0637 \u064A\u0628\u062F\u0623 \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0648\u064A\u062A\u062F\u0641\u0642 \u0627\u0644\u0623\u0631\u062C\u0648\u0646.","Lower limit: Speed 2 opens the vortex, then flux is fed into it and mixed.":"\u0627\u0644\u062D\u062F \u0627\u0644\u0633\u0641\u0644\u064A: \u062A\u0641\u062A\u062D \u0627\u0644\u0633\u0631\u0639\u0629 2 \u0627\u0644\u062F\u0648\u0627\u0645\u0629\u060C \u062B\u0645 \u064A\u064F\u063A\u0630\u0651\u0649 \u0627\u0644\u0641\u0644\u0643\u0633 \u0641\u064A\u0647\u0627 \u0648\u064A\u064F\u062E\u0644\u0637.","Vane feeder: flux at 180 g/min drawn into the vortex.":"\u0627\u0644\u0645\u063A\u0630\u064A \u0627\u0644\u0631\u064A\u0634\u064A: \u0641\u0644\u0643\u0633 \u0628\u0645\u0639\u062F\u0644 180 g/min \u064A\u064F\u0633\u062D\u0628 \u0625\u0644\u0649 \u0627\u0644\u062F\u0648\u0627\u0645\u0629.","Baffle down, Speed 3 and high argon flow: the vortex stops and fine bubbles sweep out the hydrogen.":"\u0625\u0646\u0632\u0627\u0644 \u0627\u0644\u062D\u0627\u062C\u0632\u060C \u0648\u0627\u0644\u0633\u0631\u0639\u0629 3\u060C \u0648\u062A\u062F\u0641\u0642 \u0623\u0631\u062C\u0648\u0646 \u0645\u0631\u062A\u0641\u0639: \u062A\u062A\u0648\u0642\u0641 \u0627\u0644\u062F\u0648\u0627\u0645\u0629 \u0648\u062A\u0643\u0646\u0633 \u0627\u0644\u0641\u0642\u0627\u0639\u0627\u062A \u0627\u0644\u062F\u0642\u064A\u0642\u0629 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u062C\u064A\u0646.","Done: hydrogen 0.09 ml/100 g, density index under 1 %. The rotor returns home.":"\u062A\u0645: \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u062C\u064A\u0646 0.09 ml/100 g\u060C \u0648\u0645\u0624\u0634\u0631 \u0627\u0644\u0643\u062B\u0627\u0641\u0629 \u062A\u062D\u062A 1 %. \u064A\u0639\u0648\u062F \u0627\u0644\u062F\u0648\u0651\u0627\u0631 \u0625\u0644\u0649 \u0645\u0648\u0636\u0639 \u0627\u0644\u0628\u062F\u0627\u064A\u0629."},Ku=[];var Ti="en";try{Ti=localStorage.getItem("lib-lang")==="ar"?"ar":"en"}catch{}location.hash==="#film"&&(Ti="en");var ii=()=>Ti;function ju(n){Ti=n==="ar"?"ar":"en";try{localStorage.setItem("lib-lang",Ti)}catch{}}function kc(n){if(Vc[n]!==void 0)return Vc[n];for(let[e,t]of Ku)if(e.test(n))return n.replace(e,t);return null}function xt(n){if(Ti!=="ar"||n==null||n==="")return n;let e=String(n).trim(),t=kc(e);return t==null?n:String(n).replace(e,t)}function Vs(n){let e=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);for(let t=e.nextNode();t;t=e.nextNode()){let i=t.parentNode;if(i&&(i.nodeName==="SCRIPT"||i.nodeName==="STYLE"))continue;t.__en===void 0&&(t.__en=t.nodeValue);let s=t.__en.trim();if(!s)continue;let r=Ti==="ar"?kc(s):null;t.nodeValue=r==null?t.__en:t.__en.replace(s,r)}for(let t of n.querySelectorAll("[title],[aria-label]"))for(let i of["title","aria-label"]){if(!t.hasAttribute(i))continue;let s="en"+i.replace("-","");t.dataset[s]===void 0&&(t.dataset[s]=t.getAttribute(i));let r=Ti==="ar"?kc(t.dataset[s]):null;t.setAttribute(i,r??t.dataset[s])}}var a_=new Date(2026,10,18,7,0,0).getTime(),bn=n=>String(n).padStart(2,"0"),Gc=n=>new Date(a_+n*1e3),o_=n=>{let e=Gc(n);return`${e.getMonth()+1}/${e.getDate()}/${e.getFullYear()} ${bn(e.
