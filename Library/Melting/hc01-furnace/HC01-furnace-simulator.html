/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

#app{position:absolute!important;inset:auto!important;color:#1d1f22;font-family:Inter,system-ui,sans-serif}
button,select,input{font-family:inherit}

.labels{position:absolute;inset:0}
.lb{position:absolute;left:0;top:0;width:0;height:0}
.lb .ld{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px}
.lb line{stroke:#1d1f22;stroke-width:1.2}
.lb::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#e3562a;box-shadow:0 0 0 2px #fff}
.lb span{position:absolute;left:0;top:0;white-space:nowrap;padding:4px 8px;border-radius:4px;background:rgba(29,31,34,.88);color:#fff;font:600 12px 'JetBrains Mono',monospace;letter-spacing:.3px}
.cap{position:absolute;left:24px;right:24px;bottom:96px;padding:12px 16px 14px;border-radius:7px;background:rgba(252,250,246,.95);border:1px solid #e0d9cc;font:500 16px/1.4 Inter;color:#1d1f22;transition:opacity .4s;overflow:hidden;min-height:48px}
.cap .ck{position:absolute;left:0;bottom:0;height:3px;background:#e3562a}
.ctrl{position:absolute;left:24px;right:24px;bottom:22px;height:52px;display:flex;align-items:flex-end;gap:22px}
.grp{display:flex;flex-direction:column;gap:5px}
.grp em{font:700 10px 'JetBrains Mono',monospace;letter-spacing:1.4px;color:#8a847a;font-style:normal}
.grp{flex-direction:row;flex-wrap:nowrap;align-items:center;position:relative;padding-top:18px}
.grp em{position:absolute;left:0;top:0;white-space:nowrap}
.cb{height:30px;padding:0 10px;border:1px solid #d3cdc2;border-radius:5px;background:#fbf9f5;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.6px;color:#2a2c30;cursor:pointer;margin-right:4px}
.cb.on{background:#1d1f22;color:#fff;border-color:#1d1f22}
.flt{width:230px;height:30px;border:1px solid #d3cdc2;border-radius:5px;background:#fbf9f5;font:600 12px Inter;padding:0 6px;max-width:220px}
.tour{position:absolute;right:24px;top:24px;pointer-events:auto;height:30px;padding:0 12px;border:1px solid #d3cdc2;border-radius:5px;background:#fbf9f5;font:700 10px 'JetBrains Mono',monospace;letter-spacing:1.1px;color:#2a2c30;cursor:pointer;display:flex;align-items:center;gap:8px;max-width:260px;white-space:nowrap}
.tour i{width:7px;height:7px;border-radius:50%;background:#bdb6aa;flex:none}
.tour.on i{background:#e3562a;animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}
.cursor{position:absolute;left:0;top:0;z-index:30;opacity:0;transition:opacity .3s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));pointer-events:none}
.ring{position:absolute;left:0;top:0;width:34px;height:34px;border:3px solid #e3562a;border-radius:50%;z-index:29;opacity:0;pointer-events:none}

/* ===================================================== HMI (right, 700 px) */
.hmi{position:absolute;left:900px;top:0;width:700px;height:900px;background:#c6c7c9;border-left:6px solid #2b2e33;font-family:Tahoma,Verdana,Inter,sans-serif;color:#111;display:flex;flex-direction:column;box-sizing:border-box}
.hmi *{box-sizing:border-box}
.hmi .hdr{position:static;height:74px;padding:6px 8px 0;background:#c6c7c9;display:flex;gap:6px;align-items:stretch}
.hmi .brand{width:148px;background:#fff;border:2px solid #9a9da2;display:flex;flex-direction:column;justify-content:center;padding:3px 6px}
.hmi .brand b{font:700 18px Tahoma,Verdana,sans-serif;color:#1b2f78}
.hmi .brand span{font:700 7.5px Tahoma,sans-serif;color:#1b2f78;letter-spacing:.2px}
.hmi .brand .clock{margin-top:4px;border:1px solid #444;font:700 10.5px Tahoma,sans-serif;text-align:center;padding:2px 0;color:#111}
.hmi .nav{display:flex;gap:3px}
.hmi .nb{width:60px;height:62px;border:2px solid #a8abaf;border-radius:3px;background:#d4d5d7;padding:4px;cursor:pointer}
.hmi .nb svg{width:100%;height:100%}
.hmi .nb.on{background:#f8f4a8;border-color:#7d7a2b}
.hmi .warn{margin-left:auto;width:52px;display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid #9a9da2;height:62px}
.hmi .warn svg{width:38px;height:36px;margin-top:3px}
.hmi .warn span{width:100%;background:#2b2e33;color:#fff;text-align:center;font:700 12px Tahoma,Inter,sans-serif;flex:1;display:flex;align-items:center;justify-content:center}
.hmi .warn.blink svg{animation:bl 1s steps(2) infinite}
.hmi .banner{height:24px;padding:0 8px;font:13px Tahoma,sans-serif;display:flex;align-items:center;white-space:pre;border-top:1px solid #888;border-bottom:1px solid #888}
.hmi .banner.red{background:#f00;color:#200}
.hmi .banner.amber{background:#ffb000;color:#200}
.hmi .banner.grey{background:#b5b6b8;color:#444}
.hmi .body{flex:1;position:relative;padding:10px;overflow:hidden}
.hmi .ftr{height:66px;padding:6px 8px;display:flex;align-items:center;gap:0;background:#c6c7c9}
.hmi .fb{width:82px;height:52px;background:#0b18f0;border:2px solid #000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hmi .fb i{font:700 9px Tahoma,Inter,sans-serif;font-style:normal}
.hmi .fb b{font:700 17px Tahoma,Inter,sans-serif;margin-top:3px}
.hmi .msg{flex:1;padding:0 10px;font:700 11px Tahoma,Inter,sans-serif;color:#9b1c00;line-height:1.3}
.hmi .plc{width:66px;height:50px;background:#22b33a;border:2px solid #555;display:flex;align-items:center;justify-content:center;font:700 12px Tahoma,Inter,sans-serif;color:#111}
.hmi .plc svg{width:40px}
.hmi .plc.g{background:#22f022;margin-left:3px}

/* common pieces */
.hmi h4{margin:0 0 6px;font:700 13px Tahoma,Inter,sans-serif;text-decoration:underline;color:#1b2f78;text-align:center}
.hmi .panel,.hmi .tbox,.hmi .hbx{background:#d7d8da;border:1px solid #8c8f93;padding:8px;margin-bottom:9px}
.hmi .kv{display:flex;align-items:center;gap:8px;font:12px Tahoma,Inter,sans-serif;margin:5px 0;justify-content:space-between}
.hmi .kv>span:first-child{flex:1}
.hmi .vbox{min-width:92px;padding:3px 6px;background:#fff;border:2px solid #555;font:700 13px Tahoma,Inter,sans-serif;text-align:right}
.hmi .sbox{display:inline-block;min-width:44px;padding:1px 5px;background:#fff;border:2px solid #555;font:700 11px Tahoma,Inter,sans-serif;text-align:left}
.hmi .lamp{display:inline-block;width:28px;height:13px;border:1.5px solid #222;background:#eee;flex:none}
.hmi .lamp.green{background:#2fd02f}.hmi .lamp.red{background:#f2131b}.hmi .lamp.orange{background:#ff8c00;animation:bl 1s steps(2) infinite}.hmi .lamp.amber{background:#ffd23a}.hmi .lamp.off{background:#e6e6e6}
.hmi .ll{font:12px Tahoma,Inter,sans-serif;margin-left:6px}
.hmi .hb{height:34px;padding:0 10px;background:linear-gradient(#6c7179,#4d5259);border:2px solid #2f3337;border-radius:3px;color:#fff;font:700 12px Tahoma,Inter,sans-serif;cursor:pointer}
.hmi .hb:active{transform:translateY(1px)}
.hmi .hb.wide{width:100%;margin-top:6px}
.hmi .hb.go{background:linear-gradient(#36b24a,#1f8b33)}
.hmi .hb.es{background:linear-gradient(#e43c32,#a81c14)}
.hmi .hb.es.on{outline:4px solid #ffd23a}
.hmi .hb.on{background:linear-gradient(#36b24a,#1f8b33)}
.hmi .br{display:flex;gap:6px;margin-top:6px}
.hmi .br .hb{flex:1}
.hmi select{height:26px;font:12px Tahoma,Inter,sans-serif;border:1px solid #555;background:#e8e8e8}
.hmi .mstate{height:28px;display:flex;align-items:center;justify-content:center;font:700 12px Tahoma,Inter,sans-serif;background:#a9acb0;color:#222;border:1px solid #555;margin-bottom:6px}
.hmi .mstate.run{background:#e1301f;color:#fff}
.hmi .mstate.warn{background:#ffb000}
.hmi .mstate.bad{background:#f2131b;color:#fff;animation:bl 1s steps(2) infinite}

/* furnace status */
.hmi .st{display:grid;grid-template-columns:200px 220px 1fr;gap:10px;height:100%}
.hmi .tbox h4{color:#1b2f78;font-size:12px}
.hmi .tbox .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0;white-space:normal}
.hmi .tbox .row b{font:700 22px Tahoma,Inter,sans-serif;color:#222}
.hmi .pv,.hmi .spv{width:118px;padding:4px 8px;border:2px solid #555;font:700 22px Tahoma,Inter,sans-serif;text-align:right}
.hmi .pv{background:#fbf8a0}
.hmi .spv{background:#fff;font-size:19px}
.hmi .doorst{height:54px;margin-bottom:9px;background:#2b2e47;border:2px solid #111;display:flex;align-items:center;justify-content:center;font:700 19px Tahoma,Inter,sans-serif;text-align:center}
.hmi .doorst.ok{color:#45e34a}.hmi .doorst.open{color:#ff2a2a;animation:bl 1s steps(2) infinite}
.hmi .seqtxt{font:700 11.5px Tahoma,Inter,sans-serif;text-align:center;background:#fff;border:1px solid #777;padding:5px 3px;margin-bottom:4px}
.hmi .lvl{position:relative;height:150px;margin:8px 22px 8px 6px;background:#fff;border:2px solid #555}
.hmi .lvl .lf{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#cfd4d8,#9aa3ab)}
.hmi .lvl .rod,.hmi .lvl .pm{position:absolute;left:-4px;right:-18px;height:0;border-top:2px dashed #2f9e44}
.hmi .lvl .pm{border-top-color:#d0312d}
.hmi .lvl span{position:absolute;right:20px;top:-14px;font:700 8.5px Tahoma,Inter,sans-serif;color:#2f6b34;background:#fff;padding:0 2px}
.hmi .lvl .pm span{color:#a1201a}
.hmi .full{font-size:11px}
.hmi .mot{background:#d7d8da;border:1px solid #8c8f93;padding:6px 8px;margin-bottom:9px}
.hmi .mn{height:34px;display:flex;align-items:center;justify-content:center;background:#2b2e47;border:2px solid #111;font:700 15px Tahoma,Inter,sans-serif;margin-bottom:4px}
.hmi .mn.run{color:#45e34a}.hmi .mn.stop{color:#ff3a2a}
.hmi .trf .kv{font-size:11.5px;font-weight:700;margin:6px 0}
.hmi .trf .kv span:first-child{color:#1b2f78}

/* combustion P&ID */
.hmi .cb{position:relative;height:100%}
.hmi .pid{position:absolute;left:-6px;top:0}
.pid text{font-family:Tahoma,sans-serif;text-anchor:middle}
.pid .tt{font-size:9.5px;font-weight:700}
.pid .ta{font-size:8px;font-weight:700;fill:#fff}
.pid .tb{font-size:10px;font-weight:700}
.pid .tw{font-size:8px;fill:#fff}
.pid .tn{font-size:13px;font-weight:700;text-anchor:start}
.pid .tu{font-size:13px;font-weight:700;fill:#333;text-anchor:start}
.pid .ts{font-size:8px;font-weight:700}
.pid .tm{font-size:14px;font-weight:700}
.pid .tag{fill:#fff;stroke:#666}
.pid .num{fill:#fff;stroke:#333;stroke-width:2}
.pid .auto{fill:#5aa95a;stroke:#3a6}
.pid .inlet{stroke:#f2c200;stroke-width:9}
.pid .gp,.pid .ap{fill:none;stroke-width:9;stroke-linejoin:round}
.pid .gp{stroke:#b9bdc2}
.pid .ap{stroke:#b9bdc2}
.pid .gp.flow{stroke:#e9b21c;stroke-dasharray:14 8;animation:dash .6s linear infinite}
.pid .ap.flow{stroke:#4d86e8;stroke-dasharray:14 8;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.pid .valve .body{fill:#e8e8e8;stroke:#333;stroke-width:2}
.pid .valve .core{fill:#fff;stroke:#333}
.pid .valve .act{fill:#2a2d31}
.pid .valve.on .body{fill:#2fd02f}
.pid .valve.bad .body{fill:#f2131b}
.pid .pss{fill:#e6e6e6;stroke:#333}
.pid .pss.ok{fill:#5ccf5c}.pid .pss.bad{fill:#f26a6a}.pid .pss.wait{fill:#ffd23a}.pid .pss.idle{fill:#eee}
.pid .mev{fill:#ffd23a;stroke:#b78a00}
.pid .sl{fill:#f26a6a;stroke:#600}
.pid .sl.on{fill:#2fd02f;stroke:#060}
.pid .fanc{stroke:#333;stroke-width:2}
.pid .fanc.off{fill:#fff}.pid .fanc.on{fill:#2fd02f}.pid .fanc.bad{fill:#f2131b}
.pid .cbox{fill:#3ad6d6;stroke:#333}.pid .ybox{fill:#ffd23a;stroke:#333}.pid .mbox{fill:#ff3cff;stroke:#333}.pid .obox{fill:#ff9a1a;stroke:#333}
.pid .flame .fo{fill:#ff8a2a}.pid .flame .fi{fill:#ffe14a}
.pid .flame.off{display:none}.pid .flame.small{transform:scale(.55);transform-origin:20px 0}
.hmi .leak{position:absolute;left:14px;top:92px;width:300px;background:#d7d8da;border:2px solid #333;padding:5px 8px;font:11px Tahoma,Inter,sans-serif}
.hmi .leak h5{margin:0 0 4px;text-align:center;font:700 11px Tahoma,Inter,sans-serif;background:#fff;border:1px solid #777;padding:1px}
.hmi .lg2{display:flex;gap:10px}
.hmi .lc{display:grid;grid-template-columns:auto auto;gap:3px 10px;align-items:center;align-content:start}
.hmi .lc .lamp{width:12px;height:12px;border-radius:50%}
.hmi .lc .ll{font-size:10.5px;margin-left:-6px}
.hmi .lt{display:flex;flex-direction:column;gap:2px}
.hmi .lt em{font-style:normal;font-size:9.5px;color:#333}
.hmi .purge{position:absolute;left:180px;top:470px;width:400px;background:#d7d8da;border:2px solid #333;padding:8px}
.hmi .prow{display:flex;align-items:center;gap:14px;justify-content:center;font:700 13px Tahoma,Inter,sans-serif}
.hmi .pl{background:#ddd;border:1px solid #777;padding:4px 18px;font:13px Tahoma,Inter,sans-serif}
.hmi .pl.on{background:#ffd23a}
.hmi .cyc{margin-top:6px;background:#fff;border:1px solid #777;text-align:center;font:700 13px Tahoma,Inter,sans-serif;padding:5px}
.hmi .cyc.bad{background:#f2131b;color:#fff}.hmi .cyc.ok{background:#bff0bf}
.hmi .ctl{position:absolute;left:0;right:0;bottom:2px;display:flex;gap:6px}
.hmi .ctl .hb{flex:1;height:42px}

/* parameters */
.hmi .tabs{display:flex;gap:4px;margin-bottom:10px}
.hmi .tabs .tb{flex:1;height:38px;background:linear-gradient(#6c7179,#4d5259);color:#fff;border:2px solid #2f3337;font:700 10px Tahoma,Inter,sans-serif;cursor:pointer;padding:0 3px}
.hmi .tabs .tb.on{background:#0b18f0}
.hmi .pbody{height:calc(100% - 48px);position:relative}
.hmi .tc{display:flex;gap:10px}
.hmi .tcol{flex:1;background:#c6c7c9;border:2px solid #555;padding:6px}
.hmi .th{display:flex;gap:4px;margin-bottom:6px}
.hmi .th span{flex:1;height:34px;display:flex;align-items:center;justify-content:center;font:700 10.5px Tahoma,Inter,sans-serif;color:#fff;border:2px solid #333;text-align:center}
.hmi .th .bl{background:#0b18f0}.hmi .th .gn{background:#22e022;color:#111}
.hmi .tg{display:flex;gap:6px}
.hmi .gauge{width:24px;height:300px;background:#fff;border:1px solid #333;position:relative;flex:none}
.hmi .gauge div{position:absolute;left:2px;right:2px;bottom:0;background:#ff6a00}
.hmi .gauge.p div{background:#9bcc00}
.hmi .tf{flex:1;display:flex;flex-direction:column;gap:3px}
.hmi .tf i{font:700 10px Tahoma,Inter,sans-serif;font-style:normal;background:#0b18f0;color:#fff;text-align:center;padding:3px 0}
.hmi .sp{height:28px;background:#9bcc00;border:1px solid #333;font:700 13px Tahoma,Inter,sans-serif;cursor:pointer}
.hmi .sp.w{background:#fff}
.hmi .pvb{display:block;padding:5px;background:#ddd;border:1px solid #333;font:700 13px Tahoma,Inter,sans-serif;text-align:center}
.hmi .rm{height:28px;margin-bottom:4px}
.hmi .op{margin-top:8px;height:24px;background:#22f022;text-align:center;font:700 12px Tahoma,Inter,sans-serif;padding-top:4px}
.hmi .rmk{font:10px Tahoma,Inter,sans-serif;color:#333;font-style:normal;margin-top:6px}
.hmi .lvlbox{position:absolute;right:0;bottom:0;background:#d7d8da;border:1px solid #555;padding:8px;display:flex;gap:10px;align-items:center;font:700 12px Tahoma,Inter,sans-serif}
.hmi .mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hmi .mg .hbx{margin:0}
.hmi .mg .big{grid-row:span 2}
.hmi .mg .wide2{grid-column:span 2}
.hmi .ilk p{font:12px Tahoma,Inter,sans-serif;margin:0 0 10px}
.hmi .ic{display:flex;gap:12px;align-items:center;background:#d7d8da;border:1px solid #8c8f93;padding:12px;margin-bottom:8px}
.hmi .ic .lamp{width:40px;height:22px}
.hmi .ic b{display:block;font:700 13px Tahoma,Inter,sans-serif;color:#1b2f78}
.hmi .ic span{font:11.5px Tahoma,Inter,sans-serif}

/* hydraulics */
.hmi .hy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hmi .hy .hbx{margin:0}
.hmi .bar{height:14px;background:#fff;border:1px solid #333;margin:4px 0}
.hmi .bar div{height:100%;background:#ff8c00}
.hmi .evs{margin-top:8px;font:11px Tahoma,Inter,sans-serif;line-height:2}
.hmi .evs .lamp{width:20px;height:11px;vertical-align:-1px}
.hmi .evs .ll{font-size:10.5px}
.hmi .hint{margin-top:10px;font:12px/1.4 Tahoma;background:#fff8c8;border:1px solid #b9a400;padding:8px}

/* alarms */
.hmi .al .ah{font:700 14px Tahoma,Inter,sans-serif;margin-bottom:6px}
.hmi table{width:100%;border-collapse:collapse;background:#fff;font:11.5px Tahoma,Inter,sans-serif}
.hmi th{background:#2b2e33;color:#fff;text-align:left;padding:4px 6px}
.hmi td{padding:4px 6px;border-bottom:1px solid #ccc}
.hmi tr.act td{background:#ff4040;color:#fff;font-weight:700}
.hmi tr.ackd td{background:#ffd23a}
.hmi tr.clr td{color:#555}
.hmi td.none{color:#666;text-align:center;padding:20px}
.hmi .al tbody{display:block;max-height:560px;overflow:hidden}
.hmi .al thead,.hmi .al tbody tr{display:table;width:100%;table-layout:fixed}
.hmi .al th:nth-child(1),.hmi .al td:nth-child(1){width:70px}
.hmi .al th:nth-child(2),.hmi .al td:nth-child(2){width:40px}
.hmi .al th:nth-child(4),.hmi .al td:nth-child(4){width:130px}
.hmi .ab{position:absolute;left:10px;right:10px;bottom:6px;display:flex;gap:6px}
.hmi .ab .hb{flex:1;height:42px}

/* trends */
.hmi .tr canvas{width:660px;height:440px;border:2px solid #555;background:#fff}
.hmi .lg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font:700 12px Tahoma,Inter,sans-serif}
.hmi .lg span::before{content:'';display:inline-block;width:22px;height:4px;background:var(--c);vertical-align:3px;margin-right:6px}
.hmi .lg em{font-style:normal;font-weight:400;color:#444;margin-left:auto}

/* set point keypad */
.hmi .pad{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:5}
.hmi .pad[hidden]{display:none}
.hmi .pd{width:300px;background:#d7d8da;border:2px solid #222;padding:12px}
.hmi .pt{font:700 13px Tahoma,Inter,sans-serif;margin-bottom:4px}
.hmi .pn{font:10.5px Tahoma,Inter,sans-serif;color:#7a1500;margin-bottom:8px}
.hmi .pi{width:100%;height:36px;font:700 18px Tahoma,Inter,sans-serif;text-align:right;border:2px solid #555;margin-bottom:8px}
.hmi .pk{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.hmi .pk button,.hmi .pr button{height:40px;font:700 16px Tahoma,Inter,sans-serif;background:#eee;border:1px solid #555;cursor:pointer}
.hmi .pr{display:flex;gap:5px;margin-top:5px}
.hmi .pr button{flex:1;font-size:12px}
.hmi .pr .ok{background:#22b33a;color:#fff}

/* language switch */
.langsw{position:absolute;right:24px;top:62px;pointer-events:auto;display:flex;height:26px;border:1px solid #d3cdc2;border-radius:5px;overflow:hidden;background:#fbf9f5;cursor:pointer;padding:0}
.langsw span{display:flex;align-items:center;padding:0 10px;font:700 11px 'JetBrains Mono',Tahoma,sans-serif;color:#6b6f75}
.langsw span[data-l=ar]{font:700 13px Tahoma,'Segoe UI',sans-serif}
.langsw span.on{background:#1d1f22;color:#fff}
.ov .views{top:96px}
.hmi .lang{width:70px;height:62px;margin-left:4px;background:linear-gradient(#6c7179,#4d5259);border:2px solid #2f3337;border-radius:3px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.hmi .lang b{font:700 9px Tahoma,Inter,sans-serif}
.hmi .lang span{font:700 15px Tahoma,'Segoe UI',sans-serif}

\u0627\u0644\u0641\u0639\u0644","REMOTE is on: the aluminium loop writes the chamber SP":"\u0648\u0636\u0639 \u0639\u0646 \u0628\u064F\u0639\u062F \u0645\u0641\u0639\u0651\u0644: \u062D\u0644\u0642\u0629 \u0627\u0644\u0623\u0644\u0645\u0646\u064A\u0648\u0645 \u062A\u062D\u062F\u062F \u0646\u0642\u0637\u0629 \u0636\u0628\u0637 \u0627\u0644\u062D\u062C\u0631\u0629","HA01 \xB7 FVGP-A 1-30 gas melting furnace. The burners are stopped; the metal is holding at about 708 \xB0C.":"HA01 \xB7 \u0641\u0631\u0646 \u0635\u0647\u0631 \u0628\u0627\u0644\u063A\u0627\u0632 FVGP-A 1-30. \u0627\u0644\u062D\u0648\u0627\u0631\u0642 \u0645\u062A\u0648\u0642\u0641\u0629\u060C \u0648\u0627\u0644\u0645\u0639\u062F\u0646 \u0645\u062D\u0641\u0648\u0638 \u0639\u0646\u062F \u0646\u062D\u0648 708 \xB0C.","HA01 \xB7 FVGP-A 1-30 gas melting furnace. Burners stopped, metal holding at 708 \xB0C.":"HA01 \xB7 \u0641\u0631\u0646 \u0635\u0647\u0631 \u0628\u0627\u0644\u063A\u0627\u0632 FVGP-A 1-30. \u0627\u0644\u062D\u0648\u0627\u0631\u0642 \u0645\u062A\u0648\u0642\u0641\u0629\u060C \u0648\u0627\u0644\u0645\u0639\u062F\u0646 \u0645\u062D\u0641\u0648\u0638 \u0639\u0646\u062F 708 \xB0C.","Combustion system: the gas train in yellow, combustion air from the fan in blue, two burners on the back wall.":"\u0646\u0638\u0627\u0645 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642: \u062E\u0637 \u0627\u0644\u063A\u0627\u0632 \u0628\u0627\u0644\u0623\u0635\u0641\u0631\u060C \u0648\u0647\u0648\u0627\u0621 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642 \u0645\u0646 \u0627\u0644\u0645\u0631\u0648\u062D\u0629 \u0628\u0627\u0644\u0623\u0632\u0631\u0642\u060C \u0648\u062D\u0627\u0631\u0642\u0627\u0646 \u0639\u0644\u0649 \u0627\u0644\u062C\u062F\u0627\u0631 \u0627\u0644\u062E\u0644\u0641\u064A.","Combustion screen: the gas train in yellow, combustion air in blue.":"\u0634\u0627\u0634\u0629 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642: \u062E\u0637 \u0627\u0644\u063A\u0627\u0632 \u0628\u0627\u0644\u0623\u0635\u0641\u0631\u060C \u0648\u0647\u0648\u0627\u0621 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642 \u0628\u0627\u0644\u0623\u0632\u0631\u0642.","START: the combustion fan runs up and the minimum air pressure switch proves the air.":"\u062A\u0634\u063A\u064A\u0644: \u062A\u062F\u0648\u0631 \u0645\u0631\u0648\u062D\u0629 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642 \u0648\u064A\u064F\u062B\u0628\u062A \u0645\u0641\u062A\u0627\u062D \u0627\u0644\u062D\u062F \u0627\u0644\u0623\u062F\u0646\u0649 \u0644\u0636\u063A\u0637 \u0627\u0644\u0647\u0648\u0627\u0621 \u0648\u062C\u0648\u062F \u0627\u0644\u0647\u0648\u0627\u0621.","START: the fan proves air, 70Y1 passes the tightness test, then the chamber is purged.":"\u062A\u0634\u063A\u064A\u0644: \u062A\u064F\u062B\u0628\u062A \u0627\u0644\u0645\u0631\u0648\u062D\u0629 \u0627\u0644\u0647\u0648\u0627\u0621\u060C \u0648\u064A\u062C\u062A\u0627\u0632 70Y1 \u0627\u062E\u062A\u0628\u0627\u0631 \u0627\u0644\u0625\u062D\u0643\u0627\u0645\u060C \u062B\u0645 \u062A\u064F\u0637\u0647\u064E\u0651\u0631 \u0627\u0644\u062D\u062C\u0631\u0629.","Tightness control: 70Y1 charges the section between the valves, then TEST P MAX and TEST P MIN hold it for 15 s each.":"\u0627\u062E\u062A\u0628\u0627\u0631 \u0627\u0644\u0625\u062D\u0643\u0627\u0645: \u064A\u0645\u0644\u0623 70Y1 \u0627\u0644\u0645\u0642\u0637\u0639 \u0628\u064A\u0646 \u0627\u0644\u0635\u0645\u0627\u0645\u0627\u062A\u060C \u062B\u0645 \u064A\u064F\u062D\u0628\u0633 \u0627\u0644\u0636\u063A\u0637 \u0641\u064A TEST P MAX \u0648TEST P MIN \u0644\u0645\u062F\u0629 15 \u062B \u0644\u0643\u0644 \u0645\u0646\u0647\u0645\u0627.","Pre-purge: both servomotors open fully and the fan sweeps the chamber before any gas is allowed in.":"\u0627\u0644\u062A\u0637\u0647\u064A\u0631 \u0627\u0644\u0645\u0633\u0628\u0642: \u064A\u0641\u062A\u062D \u0627\u0644\u0645\u062D\u0631\u0643\u0627\u0646 \u0627\u0644\u0645\u0624\u0627\u0632\u0631\u0627\u0646 \u0628\u0627\u0644\u0643\u0627\u0645\u0644 \u0648\u062A\u0643\u0646\u0633 \u0627\u0644\u0645\u0631\u0648\u062D\u0629 \u0627\u0644\u062D\u062C\u0631\u0629 \u0642\u0628\u0644 \u0627\u0644\u0633\u0645\u0627\u062D \u0628\u062F\u062E\u0648\u0644 \u0623\u064A \u063A\u0627\u0632.","Ignition: the servomotors close to the low-fire position, the main valves open, and each burner must prove more than 10 \xB5A of flame signal.":"\u0627\u0644\u0625\u0634\u0639\u0627\u0644: \u064A\u0639\u0648\u062F \u0627\u0644\u0645\u062D\u0631\u0643\u0627\u0646 \u0627\u0644\u0645\u0624\u0627\u0632\u0631\u0627\u0646 \u0625\u0644\u0649 \u0648\u0636\u0639 \u0627\u0644\u0644\u0647\u0628 \u0627\u0644\u0645\u0646\u062E\u0641\u0636\u060C \u0648\u062A\u064F\u0641\u062A\u062D \u0627\u0644\u0635\u0645\u0627\u0645\u0627\u062A \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629\u060C \u0648\u064A\u062C\u0628 \u0623\u0646 \u064A\u064F\u062B\u0628\u062A \u0643\u0644 \u062D\u0627\u0631\u0642 \u0625\u0634\u0627\u0631\u0629 \u0644\u0647\u0628 \u0623\u0643\u062B\u0631 \u0645\u0646 10 \xB5A.","Ignition: each burner must prove more than 10 \xB5A of flame signal, then the burners modulate.":"\u0627\u0644\u0625\u0634\u0639\u0627\u0644: \u064A\u062C\u0628 \u0623\u0646 \u064A\u064F\u062B\u0628\u062A \u0643\u0644 \u062D\u0627\u0631\u0642 \u0625\u0634\u0627\u0631\u0629 \u0644\u0647\u0628 \u0623\u0643\u062B\u0631 \u0645\u0646 10 \xB5A\u060C \u062B\u0645 \u062A\u064F\u0639\u062F\u064E\u0651\u0644 \u0642\u062F\u0631\u0629 \u0627\u0644\u062D\u0648\u0627\u0631\u0642.","Flames proved. After 10 s at low fire the chamber controller modulates the burners toward its set point.":"\u062A\u0645 \u0625\u062B\u0628\u0627\u062A \u0627\u0644\u0644\u0647\u0628. \u0628\u0639\u062F 10 \u062B \u0639\u0644\u0649 \u0627\u0644\u0644\u0647\u0628 \u0627\u0644\u0645\u0646\u062E\u0641\u0636 \u064A\u0639\u062F\u0651\u0644 \u0645\u0646\u0638\u0645 \u0627\u0644\u062D\u062C\u0631\u0629 \u0642\u062F\u0631\u0629 \u0627\u0644\u062D\u0648\u0627\u0631\u0642 \u0646\u062D\u0648 \u0646\u0642\u0637\u0629 \u0627\u0644\u0636\u0628\u0637.","Temperature control in REMOTE: the aluminium loop writes the chamber set point; high and low alarms below each.":"\u0627\u0644\u062A\u062D\u0643\u0645 \u0628\u0627\u0644\u062D\u0631\u0627\u0631\u0629 \u0641\u064A \u0648\u0636\u0639 \u0639\u0646 \u0628\u064F\u0639\u062F: \u062D\u0644\u0642\u0629 \u0627\u0644\u0623\u0644\u0645\u0646\u064A\u0648\u0645 \u062A\u062D\u062F\u062F \u0646\u0642\u0637\u0629 \u0636\u0628\u0637 \u0627\u0644\u062D\u062C\u0631\u0629\u060C \u0648\u0625\u0646\u0630\u0627\u0631\u0627\u062A \u0627\u0644\u062D\u062F\u064A\u0646 \u0627\u0644\u0623\u0639\u0644\u0649 \u0648\u0627\u0644\u0623\u062F\u0646\u0649 \u0623\u0633\u0641\u0644 \u0643\u0644 \u0645\u0646\u0647\u0645\u0627.","Charging a ladle from the hydraulic screen.":"\u062A\u062D\u0645\u064A\u0644 \u0645\u063A\u0631\u0641\u0629 \u0645\u0646 \u0627\u0644\u0634\u0627\u0634\u0629 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u0644\u064A\u0643\u064A\u0629.","Start the hydraulic group\u2026":"\u0634\u063A\u0651\u0644 \u0627\u0644\u0648\u062D\u062F\u0629 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u0644\u064A\u0643\u064A\u0629\u2026","\u2026tilt forward to lock the ladle on the platform\u2026":"\u2026\u0623\u0645\u0650\u0644 \u0644\u0644\u0623\u0645\u0627\u0645 \u0644\u0642\u0641\u0644 \u0627\u0644\u0645\u063A\u0631\u0641\u0629 \u0639\u0644\u0649 \u0627\u0644\u0645\u0646\u0635\u0629\u2026","\u2026and raise the door. With the door open the burners drop to minimum power.":"\u2026\u0648\u0627\u0631\u0641\u0639 \u0627\u0644\u0628\u0627\u0628. \u0639\u0646\u062F \u0641\u062A\u062D \u0627\u0644\u0628\u0627\u0628 \u062A\u0646\u062E\u0641\u0636 \u0627\u0644\u062D\u0648\u0627\u0631\u0642 \u0625\u0644\u0649 \u0623\u062F\u0646\u0649 \u0642\u062F\u0631\u0629.","Charging a ladle: raise the door and the burners drop to low fire.":"\u062A\u062D\u0645\u064A\u0644 \u0645\u063A\u0631\u0641\u0629: \u0627\u0631\u0641\u0639 \u0627\u0644\u0628\u0627\u0628 \u0641\u062A\u0646\u062E\u0641\u0636 \u0627\u0644\u062D\u0648\u0627\u0631\u0642 \u0625\u0644\u0649 \u0627\u0644\u0644\u0647\u0628 \u0627\u0644\u0645\u0646\u062E\u0641\u0636.","Tilt up: past the sill the metal pours in. The level rises and the bath temperature mixes.":"\u0625\u0645\u0627\u0644\u0629 \u0644\u0644\u0623\u0639\u0644\u0649: \u0628\u0639\u062F \u062A\u062C\u0627\u0648\u0632 \u0627\u0644\u0639\u062A\u0628\u0629 \u064A\u0646\u0633\u0643\u0628 \u0627\u0644\u0645\u0639\u062F\u0646\u060C \u0641\u064A\u0631\u062A\u0641\u0639 \u0627\u0644\u0645\u0633\u062A\u0648\u0649 \u0648\u062A\u0645\u062A\u0632\u062C \u062D\u0631\u0627\u0631\u0629 \u0627\u0644\u062D\u0648\u0636.","Tilt up: the ladle pours over the sill. The bath level and temperature change.":"\u0625\u0645\u0627\u0644\u0629 \u0644\u0644\u0623\u0639\u0644\u0649: \u062A\u0635\u0628 \u0627\u0644\u0645\u063A\u0631\u0641\u0629 \u0641\u0648\u0642 \u0627\u0644\u0639\u062A\u0628\u0629\u060C \u0641\u064A\u062A\u063A\u064A\u0631 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u062D\u0648\u0636 \u0648\u062D\u0631\u0627\u0631\u062A\u0647.","Tilt down\u2026":"\u0625\u0645\u0627\u0644\u0629 \u0644\u0644\u0623\u0633\u0641\u0644\u2026","\u2026lower the door; 110Y1 EV LOAD then clamps it tight and the burners modulate again.":"\u2026\u0623\u0646\u0632\u0644 \u0627\u0644\u0628\u0627\u0628\u060C \u062B\u0645 \u064A\u064F\u062D\u0643\u0645 110Y1 \u0625\u063A\u0644\u0627\u0642\u0647 \u0648\u062A\u0639\u0648\u062F \u0627\u0644\u062D\u0648\u0627\u0631\u0642 \u0644\u062A\u0639\u062F\u064A\u0644 \u0627\u0644\u0642\u062F\u0631\u0629.","Transfer to HC01: all four interlocks must be green.":"\u0627\u0644\u0646\u0642\u0644 \u0625\u0644\u0649 HC01: \u064A\u062C\u0628 \u0623\u0646 \u062A\u0643\u0648\u0646 \u0627\u0644\u0623\u0642\u0641\u0627\u0644 \u0627\u0644\u0623\u0631\u0628\u0639\u0629 \u062E\u0636\u0631\u0627\u0621.","Transfer to HC01: all four interlocks green, then START TRANSFER.":"\u0627\u0644\u0646\u0642\u0644 \u0625\u0644\u0649 HC01: \u0627\u0644\u0623\u0642\u0641\u0627\u0644 \u0627\u0644
