/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

#app{position:absolute!important;inset:auto!important;color:#1d1f22;font-family:Inter,system-ui,sans-serif}
button,select,input{font-family:inherit}

.labels{position:absolute;inset:0}
.lb{position:absolute;left:0;top:0;width:0;height:0}
.lb .ld{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px}
.lb line{stroke:#1d1f22;stroke-width:1.2}
.lb::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#e3562a;box-shadow:0 0 0 2px #fff}
.lb span{position:absolute;left:0;top:0;white-space:nowrap;padding:4px 8px;border-radius:4px;background:rgba(29,31,34,.88);color:#fff;font:600 12px 'JetBrains Mono',monospace;letter-spacing:.3px}
.cap{position:absolute;left:24px;right:24px;bottom:96px;padding:12px 16px 14px;border-radius:7px;background:rgba(252,250,246,.95);border:1px solid #e0d9cc;font:500 16px/1.4 Inter;color:#1d1f22;transition:opacity .4s;overflow:hidden;min-height:48px}
.cap .ck{position:absolute;left:0;bottom:0;height:3px;background:#e3562a}
.ctrl{position:absolute;left:24px;right:24px;bottom:22px;height:52px;display:flex;align-items:flex-end;gap:22px}
.grp{display:flex;flex-direction:column;gap:5px}
.grp em{font:700 10px 'JetBrains Mono',monospace;letter-spacing:1.4px;color:#8a847a;font-style:normal}
.grp{flex-direction:row;flex-wrap:nowrap;align-items:center;position:relative;padding-top:18px}
.grp em{position:absolute;left:0;top:0;white-space:nowrap}
.cb{height:30px;padding:0 10px;border:1px solid #d3cdc2;border-radius:5px;background:#fbf9f5;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.6px;color:#2a2c30;cursor:pointer;margin-right:4px}
.cb.on{background:#1d1f22;color:#fff;border-color:#1d1f22}
.flt{width:230px;height:30px;border:1px solid #d3cdc2;border-radius:5px;background:#fbf9f5;font:600 12px Inter;padding:0 6px;max-width:220px}
.tour{position:absolute;right:24px;top:24px;pointer-events:auto;height:30px;padding:0 12px;border:1px solid #d3cdc2;border-radius:5px;background:#fbf9f5;font:700 10px 'JetBrains Mono',monospace;letter-spacing:1.1px;color:#2a2c30;cursor:pointer;display:flex;align-items:center;gap:8px;max-width:260px;white-space:nowrap}
.tour i{width:7px;height:7px;border-radius:50%;background:#bdb6aa;flex:none}
.tour.on i{background:#e3562a;animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}
.cursor{position:absolute;left:0;top:0;z-index:30;opacity:0;transition:opacity .3s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));pointer-events:none}
.ring{position:absolute;left:0;top:0;width:34px;height:34px;border:3px solid #e3562a;border-radius:50%;z-index:29;opacity:0;pointer-events:none}


/* ===================================================== SWM#1 cabinet, local panels and trainer (right, 700 px) */
.tp{position:absolute;left:900px;top:0;width:700px;height:900px;background:#c3c7cb;border-left:6px solid #2b2e33;box-sizing:border-box;font-family:Arial,'Segoe UI',sans-serif;color:#111;display:flex;flex-direction:column}
.tp *{box-sizing:border-box}
.tp .hd{height:38px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#2b2e33;color:#fff}
.tp .hd b{font:700 14px Arial}.tp .hd span{font:700 10px Arial;color:#aab2ba;letter-spacing:.5px}
.tp .hd .clk{margin-left:auto;font:700 12px 'DejaVu Sans Mono',Consolas,monospace;color:#7fe08a}
.tp .lc{display:flex;flex-direction:column;gap:2px}
.tp .lc i{display:block;width:26px;height:8px;border-radius:2px;opacity:.25}
.tp .lc i.r{background:#e02020}.tp .lc i.a{background:#f5a000}.tp .lc i.g{background:#21b34a}
.tp .lc i.on{opacity:1;box-shadow:0 0 8px currentColor}
.tp .cab2{background:#d4d8dc;border-bottom:2px solid #8c939a;padding:8px 10px}
.tp .r1,.tp .r2{display:flex;gap:8px;align-items:flex-start}
.tp .r2{margin-top:6px}
.tp .ctl{width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tp .ctl em,.tp .sel em{font:700 8.5px Arial;font-style:normal;text-align:center;line-height:1.15;min-height:20px;display:flex;align-items:flex-end}
.tp .ctl i{font-style:normal;font:700 10px Arial}
.tp .ctl .sub{font:700 9.5px 'DejaVu Sans Mono',Consolas,monospace;color:#7a1500}
.tp .pbn{width:44px;height:44px;border-radius:50%;border:4px solid #8e959c;background:#555;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.tp .pbn span{width:28px;height:28px;border-radius:50%}
.tp .pbn.g span{background:radial-gradient(circle at 40% 35%,#6fe08a,#1a8e39)}.tp .pbn.r span{background:radial-gradient(circle at 40% 35%,#ff7d6f,#b51d12)}
.tp .pbn.b span{background:radial-gradient(circle at 40% 35%,#7fb2ff,#1f54b8)}.tp .pbn.y span{background:radial-gradient(circle at 40% 35%,#ffe680,#c99a00)}
.tp .pbn.w span{background:radial-gradient(circle at 40% 35%,#ffffff,#b9bec4)}
.tp .lmp{display:inline-block;width:14px;height:14px;border-radius:50%;background:#666;border:1px solid #222}
.tp .lmp.on{background:#4dff7a;box-shadow:0 0 8px #4dff7a}
.tp .rot{width:48px;height:48px;border-radius:50%;background:#f0c419;border:3px solid #444;cursor:pointer;position:relative;padding:0}
.tp .rot span{position:absolute;left:21px;top:4px;width:6px;height:38px;background:#c0322b;border-radius:3px;transform:rotate(-45deg);transition:transform .2s}
.tp .rot.on span{transform:rotate(0deg)}
.tp .gauge2 svg{width:80px;height:50px;background:#fff;border-radius:40px 40px 4px 4px;border:1px solid #777}
.tp .sel{width:132px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tp .sw3{display:flex;border:1px solid #333;border-radius:3px;overflow:hidden}
.tp .sw3 button{height:26px;padding:0 7px;background:#e6e8ea;border:0;border-right:1px solid #999;font:700 9.5px Arial;cursor:pointer}
.tp .sw3.vOFF button:nth-child(1),.tp .sw3.vON button:nth-child(2),.tp .sw3.vRESET button:nth-child(3){background:#1d1f22;color:#fff}
.tp .sw3.two.vAUTO button:nth-child(1),.tp .sw3.two.vMAN button:nth-child(2){background:#1d1f22;color:#fff}
.tp .hmi2{flex:1;background:#0f2a1a;border:3px solid #333;border-radius:3px;padding:4px 8px;color:#9ff0b0;font:11px 'DejaVu Sans Mono',Consolas,monospace}
.tp .kv2{display:flex;align-items:center;gap:6px;height:20px}
.tp .kv2 span{width:70px;color:#6fb985}.tp .kv2 b{min-width:62px;color:#d8ffe0}.tp .kv2 i{font-style:normal;color:#ffd23a;font-size:9.5px}
.tp .spb{background:#1f4d30;border:1px solid #6fb985;color:#d8ffe0;font:700 10px 'DejaVu Sans Mono',Consolas,monospace;cursor:pointer;padding:1px 5px}
.tp .loc{display:flex;gap:6px;padding:6px 8px;background:#c9cdd1;border-bottom:2px solid #8c939a}
.tp .lp{flex:1;background:#e3e6e9;border:1px solid #8c939a;border-radius:3px;padding:5px 6px}
.tp .lp h6{margin:0 0 3px;font:700 9.5px Arial;color:#1d3f6e}
.tp .lr{display:flex;align-items:center;gap:4px;margin:3px 0;font:10px Arial;flex-wrap:wrap}
.tp .lr em{font:700 9px Arial;font-style:normal}
.tp .lr i{font-style:normal;font-size:9.5px;color:#333}
.tp .mbt{height:22px;padding:0 6px;background:linear-gradient(#6d7680,#535b64);color:#fff;border:1px solid #333;font:700 9px Arial;cursor:pointer}
.tp .mbt.s{width:22px;padding:0}
.tp .mbt.on{background:linear-gradient(#36b24a,#1f8b33)}
.tp .knob{width:70px}
.tp .lr select{font:10px Arial;height:20px;max-width:96px}
.tp .vtag{font:700 9.5px Arial;padding:2px 6px;border:1px solid #777;background:#eee}
.tp .vtag.stable{background:#bff0bf}.tp .vtag.weak{background:#ffe9a8}.tp .vtag.aggressive{background:#f2131b;color:#fff}
.tp .tr3{flex:1;display:flex;flex-direction:column;padding:6px 8px;min-height:0}
.tp .th3{display:flex;gap:6px;align-items:center}
.tp .th3 select{font:700 11px Arial;height:26px;max-width:270px}
.tp .score{margin-left:auto;font:700 11px Arial;background:#1d1f22;color:#fff;padding:4px 8px;border-radius:3px}
.tp .tb3{flex:1;display:flex;gap:8px;margin-top:6px;min-height:0}
.tp .steps{flex:1.25;margin:0;padding:0 0 0 4px;list-style:none;overflow:auto;background:#fff;border:1px solid #8c939a}
.tp .steps li{display:flex;gap:6px;align-items:flex-start;padding:4px 6px;border-bottom:1px solid #eef0f2;font:11px/1.3 Arial;color:#666}

.tp .steps li.done{color:#2a6b34}.tp .steps li.done .st{background:#2fb44a;border-color:#2fb44a}

.tp .side{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tp .tasks{display:flex;flex-wrap:wrap;gap:3px;max-height:175px;overflow:auto}
.tp .tk{height:24px;padding:0 6px;background:#fff;border:1px solid #6d7378;border-radius:3px;font:700 9.5px Arial;cursor:pointer}

.tp .none2{font:11px Arial;color:#555;margin:2px 0}
.tp .side h6{margin:6px 0 3px;font:700 9.5px Arial;color:#7a1500}

.tp .msg2{min-height:16px;font:700 11px Arial;color:#9b1c00;margin-top:4px}
.tp .pad{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:5}
.tp .pad[hidden]{display:none}
.tp .pd{width:300px;background:#d7d8da;border:2px solid #222;padding:12px}
.tp .pt{font:700 13px Arial;margin-bottom:4px}.tp .pn{font:10.5px Arial;color:#7a1500;margin-bottom:8px}
.tp .pi{width:100%;height:36px;font:700 18px Arial;text-align:right;border:2px solid #555;margin-bottom:8px}
.tp .pk{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tp .pk button,.tp .pr button{height:40px;font:700 16px Arial;background:#eee;border:1px solid #555;cursor:pointer}
.tp .pr{display:flex;gap:5px;margin-top:5px}.tp .pr button{flex:1;font-size:12px}.tp .pr .ok{background:#22b33a;color:#fff}

.langsw{position:absolute;right:24px;top:62px;pointer-events:auto;display:flex;height:26px;border:1px solid #d3cdc2;border-radius:5px;overflow:hidden;background:#fbf9f5;cursor:pointer;padding:0}

28 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u061B \u0645\u0641\u062A\u0627\u062D\u0627 \u0627\u0644\u062D\u0648\u0627\u0631\u0642 201SH5 \u0648202SH1 \u0639\u0644\u0649 \u062A\u0634\u063A\u064A\u0644","Start the Aluswirler and set 208S1 for a stable vortex at this level":"\u0634\u063A\u0651\u0644 Aluswirler \u0648\u0627\u0636\u0628\u0637 208S1 \u0644\u062F\u0648\u0627\u0645\u0629 \u0645\u0633\u062A\u0642\u0631\u0629 \u0639\u0646\u062F \u0647\u0630\u0627 \u0627\u0644\u0645\u0633\u062A\u0648\u0649","Before loading: door closed, no cleaning, loading or maintenance, no anomaly on screen":"\u0642\u0628\u0644 \u0627\u0644\u062A\u062D\u0645\u064A\u0644: \u0627\u0644\u0628\u0627\u0628 \u0645\u063A\u0644\u0642\u060C \u0644\u0627 \u062A\u0646\u0638\u064A\u0641 \u0648\u0644\u0627 \u062A\u062D\u0645\u064A\u0644 \u0648\u0644\u0627 \u0635\u064A\u0627\u0646\u0629\u060C \u0648\u0644\u0627 \u062E\u0644\u0644 \u0639\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629","Load clean, dry scrap (chip, profile or UBC, \u2264150 mm) into the vortex":"\u062D\u0645\u0651\u0644 \u062E\u0631\u062F\u0629 \u0646\u0638\u064A\u0641\u0629 \u0648\u062C\u0627\u0641\u0629 (\u0631\u0627\u064A\u0634 \u0623\u0648 \u0645\u0642\u0627\u0637\u0639 \u0623\u0648 UBC\u060C \u2264150 mm) \u0641\u064A \u0627\u0644\u062F\u0648\u0627\u0645\u0629","Transfer to HC#1 with the extraction pump, never below the Aluswirler minimum":"\u0627\u0646\u0642\u0644 \u0625\u0644\u0649 HC#1 \u0628\u0645\u0636\u062E\u0629 \u0627\u0644\u0627\u0633\u062A\u062E\u0631\u0627\u062C\u060C \u062F\u0648\u0646 \u0627\u0644\u0646\u0632\u0648\u0644 \u062A\u062D\u062A \u0627\u0644\u062D\u062F \u0627\u0644\u0623\u062F\u0646\u0649 \u0644\u0640 Aluswirler","Cleaning the main chamber":"\u062A\u0646\u0638\u064A\u0641 \u0627\u0644\u062D\u062C\u0631\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629",'Press 210SH1 "Open door" until the door reaches the top':"\u0627\u0636\u063A\u0637 210SH1 \xAB\u0641\u062A\u062D \u0627\u0644\u0628\u0627\u0628\xBB \u062D\u062A\u0649 \u064A\u0628\u0644\u063A \u0627\u0644\u0628\u0627\u0628 \u0627\u0644\u0623\u0639\u0644\u0649","Lock the door fully open":"\u0627\u0642\u0641\u0644 \u0627\u0644\u0628\u0627\u0628 \u0645\u0641\u062A\u0648\u062D\u064B\u0627 \u0628\u0627\u0644\u0643\u0627\u0645\u0644","Drag the slag from back to front, sides first, into the bins under the door":"\u0627\u0633\u062D\u0628 \u0627\u0644\u062E\u0628\u062B \u0645\u0646 \u0627\u0644\u062E\u0644\u0641 \u0625\u0644\u0649 \u0627\u0644\u0623\u0645\u0627\u0645\u060C \u0628\u062F\u0621\u064B\u0627 \u0645\u0646 \u0627\u0644\u062C\u0627\u0646\u0628\u064A\u0646\u060C \u0625\u0644\u0649 \u0627\u0644\u0635\u0646\u0627\u062F\u064A\u0642 \u0623\u0633\u0641\u0644 \u0627\u0644\u0628\u0627\u0628","Unlock the door":"\u0641\u0643 \u0642\u0641\u0644 \u0627\u0644\u0628\u0627\u0628",'Press 210SH2 "Close door"':"\u0627\u0636\u063A\u0637 210SH2 \xAB\u0625\u063A\u0644\u0627\u0642 \u0627\u0644\u0628\u0627\u0628\xBB","Emptying the furnace (4 phases)":"\u062A\u0641\u0631\u064A\u063A \u0627\u0644\u0641\u0631\u0646 (4 \u0645\u0631\u0627\u062D\u0644)","Remove the slag and semi-solid material from the surface":"\u0623\u0632\u0644 \u0627\u0644\u062E\u0628\u062B \u0648\u0627\u0644\u0645\u0648\u0627\u062F \u0634\u0628\u0647 \u0627\u0644\u0635\u0644\u0628\u0629 \u0645\u0646 \u0627\u0644\u0633\u0637\u062D","Place a tray or bin under each plug":"\u0636\u0639 \u0635\u064A\u0646\u064A\u0629 \u0623\u0648 \u0635\u0646\u062F\u0648\u0642\u064B\u0627 \u062A\u062D\u062A \u0643\u0644 \u0633\u062F\u0627\u062F\u0629","Phase 1: drain with the extractor pump down to 300 mm":"\u0627\u0644\u0645\u0631\u062D\u0644\u0629 1: \u0627\u0644\u062A\u0635\u0631\u064A\u0641 \u0628\u0645\u0636\u062E\u0629 \u0627\u0644\u0627\u0633\u062A\u062E\u0631\u0627\u062C \u062D\u062A\u0649 300 mm","Phase 2: take a new ceramic cone":"\u0627\u0644\u0645\u0631\u062D\u0644\u0629 2: \u062E\u0630 \u0645\u062E\u0631\u0648\u0637\u064B\u0627 \u0633\u064A\u0631\u0627\u0645\u064A\u0643\u064A\u0 648\u062D\u0629 \u0645\u062A\u0648\u0642\u0641\u0629",PURGING:"\u062A\u0637\u0647\u064A\u0631",BATH:"\u0627\u0644\u062D\u0648\u0636",SCRAP:"\u0627\u0644\u062E\u0631\u062F\u0629","SWM#1, FVGP-A 3-30 sidewell melter: the chamber with its burners and main door, and the side wells: vortex well, Aluswirler, extraction pump.":"SWM#1\u060C \u0641\u0631\u0646 \u0635\u0647\u0631 \u062C\u0627\u0646\u0628\u064A FVGP-A 3-30: \u0627\u0644\u062D\u062C\u0631\u0629 \u0628\u062D\u0648\u0627\u0631\u0642\u0647\u0627 \u0648\u0628\u0627\u0628\u0647\u0627 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u060C \u0648\u0627\u0644\u0622\u0628\u0627\u0631 \u0627\u0644\u062C\u0627\u0646\u0628\u064A\u0629: \u0628\u0626\u0631 \u0627\u0644\u062F\u0648\u0627\u0645\u0629\u060C \u0648Aluswirler\u060C \u0648\u0645\u0636\u062E\u0629 \u0627\u0644\u0627\u0633\u062A\u062E\u0631\u0627\u062C.","Initial warm-up (\xA72): master switch 20Q1, auxiliary connection, safety relay reset.":"\u0627\u0644\u062A\u0633\u062E\u064A\u0646 \u0627\u0644\u0623\u0648\u0644\u064A (\xA72): \u0627\u0644\u0645\u0641\u062A\u0627\u062D \u0627\u0644\u0631\u0626\u064A\u0633\u064A 20Q1\u060C \u0648\u0627\u0644\u062A\u0648\u0635\u064A\u0644 \u0627\u0644\u0645\u0633\u0627\u0639\u062F\u060C \u0648\u0625\u0639\u0627\u062F\u0629 \u0636\u0628\u0637 \u0645\u0631\u062D\u0651\u0644 \u0627\u0644\u0623\u0645\u0627\u0646.","201SH3 starts the combustion fan: a 5 min purge with the lamp flashing, while the tightness control checks the solenoid valves.":"201SH3 \u064A\u0634\u063A\u0651\u0644 \u0645\u0631\u0648\u062D\u0629 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642: \u062A\u0637\u0647\u064A\u0631 5 \u062F\u0642\u0627\u0626\u0642 \u0648\u0627\u0644\u0645\u0635\u0628\u0627\u062D \u064A\u0648\u0645\u0636\u060C \u0628\u064A\u0646\u0645\u0627 \u064A\u0641\u062D\u0635 \u0627\u062E\u062A\u0628\u0627\u0631 \u0627\u0644\u0625\u062D\u0643\u0627\u0645 \u0627\u0644\u0635\u0645\u0627\u0645\u0627\u062A.",'Purge done, lamp steady: "Open main solenoid valve" sends gas and oxygen to the burners.':"\u0627\u0646\u062A\u0647\u0649 \u0627\u0644\u062A\u0637\u0647\u064A\u0631 \u0648\u0627\u0644\u0645\u0635\u0628\u0627\u062D \u062B\u0627\u0628\u062A: \xAB\u0641\u062A\u062D \u0627\u0644\u0635\u0645\u0627\u0645 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\xBB \u064A\u0631\u0633\u0644 \u0627\u0644\u063A\u0627\u0632 \u0648\u0627\u0644\u0623\u0643\u0633\u062C\u064A\u0646 \u0625\u0644\u0649 \u0627\u0644\u062D\u0648\u0627\u0631\u0642.","Selectors 201SH5 and 202SH1 to ON: both burners light. From cold, raise the set point gradually over a day so moisture escapes.":"\u0627\u0644\u0645\u0641\u062A\u0627\u062D\u0627\u0646 201SH5 \u0648202SH1 \u0639\u0644\u0649 \u062A\u0634\u063A\u064A\u0644: \u064A\u0634\u062A\u0639\u0644 \u0627\u0644\u062D\u0627\u0631\u0642\u0627\u0646. \u0645\u0646 \u0627\u0644\u0628\u0627\u0631\u062F\u060C \u0627\u0631\u0641\u0639 \u0646\u0642\u0637\u0629 \u0627\u0644\u0636\u0628\u0637 \u062A\u062F\u0631\u064A\u062C\u064A\u064B\u0627 \u062E\u0644\u0627\u0644 \u064A\u0648\u0645 \u0644\u064A\u062E\u0631\u062C \u0627\u0644\u0628\u0644\u0644.","Permanent regime (\xA73): the Aluswirler (207SH1, 208SH2 MAN, speed 208S1) pulls a stable vortex in the side well.":"\u0627\u0644\u062A\u0634\u063A\u064A\u0644 \u0627\u0644\u062F\u0627\u0626\u0645 (\xA73): \u064A\u0633\u062D\u0628 Aluswirler (207SH1\u060C 208SH2 \u064A\u062F\u0648\u064A\u060C \u0627\u0644\u0633\u0631\u0639\u0629 208S1) \u062F\u0648\u0627\u0645\u0629 \u0645\u0633\u062A\u0642\u0631\u0629 \u0641\u064A \u0627\u0644\u0628\u0626\u0631 \u0627\u0644\u062C\u0627\u0646\u0628\u064A.","Clean, dry, loose scrap (chip, profile, UBC, under 150 mm) is fed in and swallowed under the metal.":"\u062A\u064F\u063A\u0630\u0651\u0649 \u062E\u0631\u062F\u0629 \u0646\u0638\u064A\u0641\u0629 \u0648\u062C\u0627\u0641\u0629 \u0648\u0645\u0641\u0643\u0643\u0629 (\u0631\u0627\u064A\u0634\u060C \u0645\u0642\u0627\u0637\u0639\u060C UBC\u060C \u0623\u0642\u0644 \u0645\u0646 150 mm) \u0648\u062A\u064F\u0628\u062A\u0644\u0639 \u062A\u062D\u062A \u0627\u0644\u0645\u0639\u062F\u0646.","Too fast for this level: an aggressive vortex draws air in. Flames and dross: lower the speed.":"\u0633\u0631\u0639\u0629 \u0632\u0627\u0626\u062F\u0629 \u0644\u0647\u0630\u0627 \u0627\u0644\u0645\u0633\u062A\u0648\u0649: \u062F\u0648\u0627\u0645\u0629 \u0639\u0646\u064A\u0641\u0629 \u062A\u0633\u062D\u0628 \u0627\u0644\u0647\u0648\u0627\u0621. \u0644\u0647\u0628 \u0648\u062E\u0628\u062B: \u0627\u062E\u0641\u0636 \u0627\u0644\u0633\u0631\u0639\u0629.","Back to a stable vortex.":"\u0639\u0648\u062F\u0629 \u0625\u0644\u0649 \u062F\u0648\u0627\u0645\u0629 \u0645\u0633\u062A\u0642\u0631\u0629.","Impeller change (\xA76.3\u20136.4): stop the rotation completely first. Never lift a turning impeller.":"\u062A\u063A\u064A\u064A\u0631 \u0627\u0644\u062F\u0641\u0651\u0627\u0639\u0629 (\xA76.3\u20136.4): \u0623\u0648\u0642\u0641 \u0627\u0644\u062F\u0648\u0631\u0627\u0646 \u062A\u0645\u0627\u0645\u064B\u0627 \u0623\u0648\u0644\u064B\u0627. \u0644\u0627 \u062A\u0631\u0641\u0639 \u062F\u0641\u0651\u0627\u0639\u0629 \u062A\u062F\u0648\u0631 \u0623\u0628\u062F\u064B\u0627.","Clips loose, hoist up, onto the maintenance support to cool.":"\u0627\u0644\u0645\u0634\u0627\u0628\u0643 \u0645\u0641\u0643\u0648\u0643\u0629\u060C \u0631\u0641\u0639 \u0628\u0627\u0644\u0631\u0627\u0641\u0639\u0629\u060C \u0625\u0644\u0649 \u062D\u0627\u0645\u0644 \u0627\u0644\u0635\u064A\u0627\u0646\u0629 \u0644\u062A\u0628\u0631\u062F.","A new impeller, dried 24 h on the vault, fitted, turned at 10 % and aligned, bolts tightened; the volute cleaned.":"\u062F\u0641\u0651\u0627\u0639\u0629 \u062C\u062F\u064A\u062F\u0629 \u062C\u064F\u0641\u0641\u062A 24 \u0633\u0627\u0639\u0629 \u0639\u0644\u0649 \u0627\u0644\u0633\u0642\u0641\u060C \u0631\u064F\u0643\u0651\u0628\u062A \u0648\u0623\u064F\u062F\u064A\u0631\u062A \u0628\u0633\u0631\u0639\u0629 10 % \u0648\u0636\u064F\u0628\u0637\u062A \u0627\u0633\u062A\u0642\u0627\u0645\u062A\u0647\u0 \u063A (\xA76.2.2) \u0639\u0644\u0649 4 \u0645\u0631\u0627\u062D\u0644: \u0625\u0632\u0627\u0644\u0629 \u062E\u0628\u062B \u0627\u0644\u0633\u0637\u062D \u0648\u0635\u064A\u0646\u064A\u0629 \u062A\u062D\u062A \u0643\u0644 \u0633\u062F\u0627\u062F\u0629\u060C \u062B\u0645 \u0627\u0644\u0645\u0636\u062E\u0629 \u062D\u062A\u0649 300 mm\u2026","\u2026then the pneumatic plug with a new ceramic cone, and the manual plugs, each with its lock removed and PPE on.":"\u2026\u062B\u0645 \u0627\u0644\u0633\u062F\u0627\u062F\u0629 \u0627\u0644\u0647\u0648\u0627\u0626\u064A\u0629 \u0628\u0645\u062E\u0631\u0648\u0637 \u0633\u064A\u0631\u0627\u0645\u064A\u0643\u064A \u062C\u062F\u064A\u062F\u060C \u0648\u0627\u0644\u0633\u062F\u0627\u062F\u0627\u062A \u0627\u0644\u064A\u062F\u0648\u064A\u0629\u060C \u0643\u0644 \u0645\u0646\u0647\u0627 \u0628\u0639\u062F \u0625\u0632\u0627\u0644\u0629 \u0642\u0641\u0644\u0647\u0627 \u0648\u0627\u0631\u062A\u062F\u0627\u0621 \u0645\u0639\u062F\u0627\u062A \u0627\u0644\u0648\u0642\u0627\u064A\u0629.","Seven procedures from the manual, each step checked and every violation recorded. Pick one, load its starting situation and try it.":"\u0633\u0628\u0639\u0629 \u0625\u062C\u0631\u0627\u0621\u0627\u062A \u0645\u0646 \u0627\u0644\u062F\u0644\u064A\u0644\u060C \u062A\u064F\u0641\u062D\u0635 \u0643\u0644 \u062E\u0637\u0648\u0629 \u0648\u062A\u064F\u0633\u062C\u064E\u0651\u0644 \u0643\u0644 \u0645\u062E\u0627\u0644\u0641\u0629. \u0627\u062E\u062A\u0631 \u0625\u062C\u0631\u0627\u0621\u064B\u060C \u0648\u062D\u0645\u0651\u0644 \u0648\u0636\u0639 \u0628\u062F\u0627\u064A\u062A\u0647\u060C \u0648\u062C\u0631\u0651\u0628\u0647.","SWM#1 sidewell melter: chamber, vortex well, Aluswirler and extraction pump.":"\u0641\u0631\u0646 \u0627\u0644\u0635\u0647\u0631 \u0627\u0644\u062C\u0627\u0646\u0628\u064A SWM#1: \u0627\u0644\u062D\u062C\u0631\u0629\u060C \u0648\u0628\u0626\u0631 \u0627\u0644\u062F\u0648\u0627\u0645\u0629\u060C \u0648Aluswirler\u060C \u0648\u0645\u0636\u0
