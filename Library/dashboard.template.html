<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipment Library</title>
<style>
/* Layout: a process strip of the seven plant areas in metal-flow order, then the chosen area's machine cards. */
:root {
  --bg: #eef0f2; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6670; --line: #d5dade; --chip: #e3e7ea;
  --accent: #c8471b; --accent-ink: #ffffff; --accent-soft: #f6e2d9; --steel: #2f3a45;
  --display: Bahnschrift, "DIN Alternate", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191d; --panel: #1e2328; --ink: #e9ecef; --muted: #9aa4ae; --line: #2f363d; --chip: #283037;
  --accent: #e8683a; --accent-ink: #1a0d06; --accent-soft: #3a2219; --steel: #c9d1d8; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191d; --panel: #1e2328; --ink: #e9ecef; --muted: #9aa4ae; --line: #2f363d; --chip: #283037;
  --accent: #e8683a; --accent-ink: #1a0d06; --accent-soft: #3a2219; --steel: #c9d1d8; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; margin-bottom: 22px }
h1 { font: 600 34px/1.1 var(--display); letter-spacing: .2px; margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 4px 0 0 }
.total { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }

/* process strip */
.flow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 26px }
.stage { position: relative; display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 12px 14px 12px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: inherit; text-decoration: none; cursor: pointer }
.stage:hover { border-color: var(--muted) }
.stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.stage .n { font: 11px var(--mono); color: var(--muted); letter-spacing: 1px }
.stage .nm { font: 600 16px/1.2 var(--display); overflow-wrap: anywhere }
.stage .ct { font: 12px var(--body); color: var(--muted); font-variant-numeric: tabular-nums }
.stage.on { background: var(--steel); border-color: var(--steel); color: var(--bg) }
.stage.on .n, .stage.on .ct { color: var(--bg); opacity: .75 }
.stage.has::after { content: ""; position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent) }
@media (max-width: 860px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

/* area */
.areahead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px }
h2 { font: 600 24px var(--display); margin: 0 }
.path { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 18px }
.card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0 }
.poster { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--chip); border: 0; padding: 0; cursor: pointer; display: block; width: 100% }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block }
.poster .play { position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 10px;
  background: rgba(20, 24, 28, .82); color: #fff; border-radius: 4px; font: 600 13px var(--body) }
.poster .play i { width: 0; height: 0; border-left: 10px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent }
.poster:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.body { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 18px; min-width: 0 }
.card h3 { font: 600 20px/1.2 var(--display); margin: 0 }
.eq { font: 12px var(--mono); color: var(--muted); margin: 0 }
.sum { margin: 0; max-width: 62ch }
.open { align-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 5px; background: var(--accent);
  color: var(--accent-ink); font: 600 14px var(--body); text-decoration: none }
.open:hover { filter: brightness(1.06) }
.open:focus-visible, .dl a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.dl { display: flex; flex-direction: column; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; gap: 2px }
.dl .lbl { font: 11px var(--mono); letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px }
.dl a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 8px; margin: 0 -8px; border-radius: 4px; color: var(--ink); text-decoration: none; min-width: 0 }
.dl a:hover { background: var(--chip) }
.dl a span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.dl a .meta { flex: none; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.dl a .meta b { color: var(--accent); font-weight: 600 }
.empty { padding: 34px 26px; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; max-width: 640px }
.empty h3 { font: 600 19px var(--display); margin: 0 0 6px }
.empty p { margin: 0; color: var(--muted) }
footer { margin-top: 36px; font-size: 13px; color: var(--muted) }

dialog { width: min(1100px, 94vw); padding: 0; border: 0; border-radius: 8px; background: #000; color: #fff }
dialog::backdrop { background: rgba(8, 10, 12, .78) }
dialog video { display: block; width: 100%; height: auto; max-height: 80vh; background: #000 }
dialog .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; font: 600 14px var(--body) }
dialog button { background: none; border: 1px solid #555; color: #fff; border-radius: 4px; padding: 5px 12px; font: 13px var(--body); cursor: pointer }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title">Equipment Library</h1><p class="sub">Plant areas in metal-flow order. Each machine has its 3D simulator, a tour video and its manuals.</p></div>
    <div class="total" id="total"></div>
  </header>
  <nav class="flow" id="flow" aria-label="Plant areas"></nav>
  <main id="area"></main>
  <footer>Open the 3D simulators in Chrome or Edge. Files live in the <code>Library</code> folder beside this page.</footer>
</div>
<dialog id="player"><div class="bar"><span id="ptitle"></span><button id="pclose" type="button">Close</button></div><video id="pvideo" controls playsinline></video></dialog>
<script>
const DATA = /*__DATA__*/null;
const $ = (q) => document.querySelector(q);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mb = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
const ext = (n) => n.split('.').pop().toUpperCase();

const count = DATA.areas.reduce((n, a) => n + a.packages.length, 0);
$('#total').textContent = `${count} machine${count === 1 ? '' : 's'} · ${DATA.areas.length} areas`;
$('#flow').innerHTML = DATA.areas.map((a, i) => `<a class="stage${a.packages.length ? ' has' : ''}" href="#${a.id}" data-id="${a.id}">
  <span class="n">${String(i + 1).padStart(2, '0')}</span><span class="nm">${esc(a.name)}</span>
  <span class="ct">${a.packages.length ? a.packages.length + ' machine' + (a.packages.length > 1 ? 's' : '') : 'empty'}</span></a>`).join('');

function card(p) {
  const docs = p.docs.map((d) => `<a href="${d.href}" download><span>${esc(d.label)}</span><span class="meta"><b>${ext(d.name)}</b> ${mb(d.size)}</span></a>`).join('');
  return `<article class="card">
    ${p.video ? `<button class="poster" type="button" data-video="${p.video}" data-title="${esc(p.title)}" aria-label="Play the ${esc(p.title)} video">
      ${p.poster ? `<img src="${p.poster}" alt="">` : ''}<span class="play"><i></i>Play video</span></button>` : ''}
    <div class="body">
      <h3>${esc(p.title)}</h3>
      <p class="eq">${esc(p.equipment)}</p>
      <p class="sum">${esc(p.summary)}</p>
      ${p.sim ? `<a class="open" href="${p.sim}" target="_blank" rel="noopener">Open 3D simulator</a>` : ''}
      <div class="dl"><span class="lbl">Downloads</span>
        ${docs}
        ${p.video ? `<a href="${p.video}" download><span>Tour video</span><span class="meta"><b>MP4</b> ${mb(p.videoSize)}</span></a>` : ''}
        ${p.sim ? `<a href="${p.sim}" download><span>3D simulator page</span><span class="meta"><b>HTML</b> ${mb(p.simSize)}</span></a>` : ''}
      </div>
    </div></article>`;
}

function show() {
  const id = location.hash.slice(1);
  const a = DATA.areas.find((x) => x.id === id) || DATA.areas.find((x) => x.packages.length) || DATA.areas[0];
  for (const s of document.querySelectorAll('.stage')) {
    const on = s.dataset.id === a.id;
    s.classList.toggle('on', on);
    s.setAttribute('aria-current', on ? 'page' : 'false');
  }
  $('#area').innerHTML = `<div class="areahead"><h2>${esc(a.name)}</h2><span class="path">Library / ${esc(a.folder)}</span></div>` +
    (a.packages.length ? `<div class="grid">${a.packages.map(card).join('')}</div>`
      : `<div class="empty"><h3>No machines in ${esc(a.name)} yet</h3><p>Send the manuals for this area. Each machine is added here with its 3D simulator, a tour video and the manuals to download.</p></div>`);
}
addEventListener('hashchange', show);
show();

const dlg = $('#player');
const vid = $('#pvideo');
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-video]');
  if (!b) return;
  $('#ptitle').textContent = b.dataset.title;
  vid.src = b.dataset.video;
  dlg.showModal();
  vid.play().catch(() => {});
});
const stop = () => { vid.pause(); vid.removeAttribute('src'); vid.load(); };
$('#pclose').addEventListener('click', () => dlg.close());
dlg.addEventListener('close', stop);
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
